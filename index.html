<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>orça•me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#0B0F14; --surface:#12171F; --surface-2:#171D27; --border:#232A36;
  --text:#EDF0F4; --text-muted:#8992A3; --text-faint:#5C6576;
  --primary:#17C787; --primary-dark:#0EA972; --primary-tint:#0F2A22;
  --danger:#F0554A; --danger-tint:#2E1618;
  --warning:#F2B23D; --warning-tint:#2E2412;
  --info:#4C93F5; --info-tint:#131F30;
  --orange-a:#F5A524; --orange-b:#F0721F;
  --navy-a:#2B3444; --navy-b:#141922;
  --violet-a:#8B7CF6; --violet-b:#6C5CE7;
  --radius-lg:16px; --radius:12px; --radius-sm:8px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 8px 20px rgba(0,0,0,.35);
  --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{overflow-x:hidden;}
body{font-family:var(--sans); background:var(--bg); color:var(--text); font-size:14px; line-height:1.45;}
*{max-width:100%;}
.app, .main, .content{min-width:0;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:#D7DAE0; border-radius:8px;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:14px;}
a{color:inherit;}

.app{display:flex; min-height:100vh;}

/* ---- Sidebar ---- */
.app{display:flex; flex-direction:column; min-height:100vh;}
.topnav{
  position:sticky; top:0; z-index:50; background:var(--surface); border-bottom:1px solid var(--border);
}
.topnav-main{display:flex; align-items:center; gap:16px; padding:12px 24px;}
.brand{display:flex; align-items:center; gap:10px; flex-shrink:0;}
.brand-icon{width:36px; height:36px; border-radius:11px; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); display:flex; align-items:center; justify-content:center; font-size:17px;}
.brand-text b{font-size:15.5px; font-weight:800; letter-spacing:-.02em; display:block;}
.brand-text span{font-size:10.5px; color:var(--text-muted);}
.topnav-strip{display:flex; align-items:center; gap:4px; padding:0 20px 10px; overflow-x:auto; scrollbar-width:none;}
.topnav-strip::-webkit-scrollbar{display:none;}
.nav-item{
  display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:9px;
  color:var(--text-muted); font-weight:500; font-size:13.5px; border:none; background:none; white-space:nowrap;
  transition:background .12s, color .12s; flex-shrink:0;
}
.nav-item:hover{background:var(--surface-2); color:var(--text);}
.nav-item.active{background:var(--primary-tint); color:var(--primary-dark); font-weight:600;}
.nav-item .ic{font-size:15px;}
.sidebar-foot{display:none;}

/* ---- Main ---- */
.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  display:flex; align-items:center; gap:14px; padding:14px 28px; background:var(--surface);
  border-bottom:1px solid var(--border);
}
.searchbox{
  flex:1; max-width:420px; display:flex; align-items:center; gap:8px; background:var(--surface-2);
  border:1px solid var(--border); border-radius:10px; padding:8px 12px; color:var(--text-faint);
}
.searchbox input{border:none; background:none; outline:none; flex:1; color:var(--text); font-size:13.5px;}
.icon-btn{
  width:36px; height:36px; border-radius:10px; border:1px solid var(--border); background:var(--surface);
  display:flex; align-items:center; justify-content:center; color:var(--text-muted); position:relative; flex-shrink:0;
}
.icon-btn:hover{background:var(--surface-2);}
.dot-badge{position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--danger); border:1.5px solid var(--surface);}

.content{padding:26px 28px 60px; flex:1;}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
.page-head h1{font-size:23px; font-weight:800; letter-spacing:-.02em;}
.page-head p{color:var(--text-muted); font-size:13px; margin-top:2px;}
.head-actions{display:flex; gap:10px; align-items:center;}

.month-switch{display:flex; align-items:center; gap:2px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:4px;}
.month-switch button{width:28px; height:28px; border:none; background:none; border-radius:7px; color:var(--text-muted); display:flex; align-items:center; justify-content:center; font-size:14px;}
.month-switch button:hover{background:var(--surface-2);}
.month-switch .lbl{font-weight:600; font-size:13px; padding:0 10px; min-width:118px; text-align:center; font-variant-numeric:tabular-nums;}

.btn{
  display:inline-flex; align-items:center; gap:7px; border:none; border-radius:10px; padding:9px 15px;
  font-weight:600; font-size:13.5px; white-space:nowrap; transition:filter .12s, transform .05s;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--primary); color:#fff;}
.btn-primary:hover{filter:brightness(1.06);}
.btn-outline{background:var(--surface); color:var(--text); border:1px solid var(--border);}
.btn-outline:hover{background:var(--surface-2);}
.btn-danger-ghost{background:var(--danger-tint); color:var(--danger);}
.btn-ghost{background:none; color:var(--text-muted); padding:8px 10px;}
.btn-ghost:hover{color:var(--text); background:var(--surface-2); border-radius:8px;}
.btn-sm{padding:6px 11px; font-size:12.5px; border-radius:8px;}

/* ---- Cards / grid ---- */
.grid{display:grid; gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g2{grid-template-columns:1.1fr .9fr;}
.g3{grid-template-columns:repeat(3,1fr);}
@media(max-width:1100px){ .g4{grid-template-columns:repeat(2,1fr);} .g2{grid-template-columns:1fr;} .g3{grid-template-columns:1fr;} }

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm);}
.card-pad{padding:18px 20px;}
.stat-card{padding:17px 18px;}
.stat-top{display:flex; align-items:center; gap:8px; color:var(--text-muted); font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; margin-bottom:10px;}
.stat-top .ic{width:22px; height:22px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:12px;}
.stat-value{font-family:var(--mono); font-size:23px; font-weight:600; letter-spacing:-.01em; font-variant-numeric:tabular-nums;}
.stat-sub{font-size:11.5px; color:var(--text-faint); margin-top:3px;}
.up{color:var(--primary);} .down{color:var(--danger);}

.section-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.section-title h3{font-size:14.5px; font-weight:700; display:flex; align-items:center; gap:8px;}
.section-title .meta{font-size:12px; color:var(--text-faint);}
.section-title a{font-size:12.5px; color:var(--primary); font-weight:600; text-decoration:none;}

.legend-row{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--surface-2);}
.legend-row:last-child{border-bottom:none;}
.legend-dot{width:9px; height:9px; border-radius:3px; flex-shrink:0;}
.legend-name{flex:1; font-weight:500; font-size:13px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.legend-pct{font-family:var(--mono); font-size:12px; color:var(--text-faint); width:42px; text-align:right;}
.legend-val{font-family:var(--mono); font-size:13px; font-weight:600; width:92px; text-align:right;}

.empty-state{padding:44px 20px; text-align:center; color:var(--text-faint);}
.empty-state .ic{font-size:30px; margin-bottom:10px;}
.empty-state b{color:var(--text-muted); display:block; margin-bottom:4px; font-size:13.5px;}
.empty-state span{font-size:12.5px;}

/* ---- Badges / status ---- */
.badge{display:inline-flex; align-items:center; padding:2px 8px; border-radius:6px; font-size:11px; font-weight:600;}
.badge-fixa{background:var(--info-tint); color:var(--info);}
.badge-parcela{background:var(--violet-a)22; background:#EFEAFB; color:var(--violet-b);}
.badge-pendente{background:var(--warning-tint); color:#A6720F;}
.badge-pago{background:var(--primary-tint); color:var(--primary-dark);}
.badge-atrasado{background:var(--danger-tint); color:var(--danger);}

/* ---- Table / transaction list ---- */
.tx-row{display:flex; align-items:center; gap:13px; padding:13px 4px; border-bottom:1px solid var(--surface-2);}
.tx-row:last-child{border-bottom:none;}
.tx-ic{width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
.tx-ic.in{background:var(--primary-tint);} .tx-ic.out{background:var(--danger-tint);}
.tx-main{flex:1; min-width:0;}
.tx-title-row{display:flex; align-items:center; gap:7px;}
.tx-title{font-weight:600; font-size:13.5px;}
.tx-sub{font-size:12px; color:var(--text-faint); margin-top:1px;}
.tx-amt{font-family:var(--mono); font-weight:600; font-size:13.5px; white-space:nowrap;}
.tx-actions{display:flex; gap:4px; opacity:0; transition:opacity .12s;}
.tx-row:hover .tx-actions{opacity:1;}
.tx-actions button{width:28px; height:28px; border:none; background:var(--surface-2); border-radius:7px; color:var(--text-muted); font-size:12px;}
.tx-actions button:hover{background:var(--border);}

.filters-bar{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
.select, .input{
  border:1px solid var(--border); background:var(--surface); border-radius:9px; padding:8px 11px; font-size:13px; color:var(--text);
  outline:none;
}
.select:focus, .input:focus{border-color:var(--primary);}
.search-inline{flex:1; min-width:220px; display:flex; align-items:center; gap:7px; border:1px solid var(--border); background:var(--surface); border-radius:9px; padding:8px 11px;}
.search-inline input{border:none; outline:none; flex:1; background:none;}

/* ---- Cards page: credit card visuals ---- */
.ccard{
  border-radius:16px; padding:20px 20px 16px; color:#fff; position:relative; overflow:hidden; min-height:118px;
  display:flex; flex-direction:column; justify-content:space-between;
}
.ccard::after{content:''; position:absolute; right:-30px; top:-30px; width:140px; height:140px; border-radius:50%; background:rgba(255,255,255,.08);}
.ccard .bank{font-size:11px; opacity:.75; text-transform:uppercase; letter-spacing:.05em;}
.ccard .name{font-size:17px; font-weight:700; margin-top:2px;}
.ccard .digits{font-family:var(--mono); font-size:13px; opacity:.85; letter-spacing:.08em;}
.cc-orange{background:linear-gradient(135deg,var(--orange-a),var(--orange-b));}
.cc-navy{background:linear-gradient(135deg,var(--navy-a),var(--navy-b));}
.cc-violet{background:linear-gradient(135deg,var(--violet-a),var(--violet-b));}
.cc-green{background:linear-gradient(135deg,#22B07D,#0B7A55);}
.ccard-foot{display:flex; justify-content:space-between; padding:14px 4px 4px; font-size:12px;}
.ccard-foot div b{display:block; font-family:var(--mono); font-size:14px; font-weight:600; margin-top:2px;}
.ccard-wrap{cursor:pointer;}
.card-actions-row{display:flex; justify-content:flex-end; gap:6px; padding:8px 2px 0;}

/* ---- Category grid ---- */
.cat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
@media(max-width:1100px){.cat-grid{grid-template-columns:repeat(2,1fr);}}
.cat-tile{border:1px solid var(--border); border-radius:12px; padding:14px; display:flex; align-items:center; gap:11px; background:var(--surface); position:relative;}
.cat-tile .ic{width:36px; height:36px; border-radius:9px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:17px;}
.cat-tile .nm{font-weight:600; font-size:13.5px;}
.cat-tile .edit-mini{position:absolute; top:8px; right:8px; display:none; gap:3px;}
.cat-tile:hover .edit-mini{display:flex;}
.cat-tile .edit-mini button{width:22px; height:22px; border:none; background:var(--surface-2); border-radius:6px; font-size:10px;}

.tabs{display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:10px; width:fit-content; margin-bottom:18px;}
.tab{border:none; background:none; padding:7px 15px; border-radius:8px; font-size:13px; font-weight:600; color:var(--text-muted);}
.tab.active{background:var(--surface); color:var(--text); box-shadow:var(--shadow-sm);}

/* ---- Goals ---- */
.goal-card{padding:16px 18px;}
.goal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:9px;}
.goal-head .nm{display:flex; align-items:center; gap:8px; font-weight:600; font-size:13.5px;}
.goal-amts{font-family:var(--mono); font-size:12.5px; color:var(--text-muted);}
.progress-track{height:8px; background:var(--surface-2); border-radius:5px; overflow:hidden;}
.progress-fill{height:100%; border-radius:5px; transition:width .3s;}

/* ---- Árvore do Orçamento ---- */
.tree-row{display:flex; align-items:center; gap:14px; padding:6px 0; cursor:default;}
.tree-row.oc-hoverable{cursor:pointer;}
.tree-row.oc-hoverable:hover .tree-track{filter:brightness(0.97);}
.tree-track{position:relative; flex:1; height:38px; background:var(--surface-2); border-radius:8px; overflow:hidden; display:flex; align-items:center;}
.tree-fill{position:absolute; left:0; top:0; bottom:0; border-radius:8px; transition:width .35s ease;}
.tree-fill-root{background:linear-gradient(90deg, #0B7D57, #0EA972);}
.tree-fill-cat{background:linear-gradient(90deg, #0EA972, #4FCB9B);}
.tree-fill-saldo{background:linear-gradient(90deg, #C7CCD4, #DDE1E6);}
.tree-label{position:relative; z-index:1; padding:0 14px; font-size:13px; font-weight:600; color:#0B1F16; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.tree-val{width:120px; text-align:right; font-family:var(--mono); font-size:13px; font-weight:700; flex-shrink:0;}

/* ---- Modal ---- */
.modal-overlay{position:fixed; inset:0; background:rgba(15,18,24,.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; backdrop-filter:blur(2px);}
.modal{background:var(--surface); border-radius:18px; width:100%; max-width:520px; max-height:88vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal.wide{max-width:760px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); z-index:2;}
.modal-head h3{font-size:16px; font-weight:700;}
.modal-body{padding:20px 22px;}
.modal-foot{display:flex; justify-content:flex-end; gap:10px; padding:16px 22px; border-top:1px solid var(--border); position:sticky; bottom:0; background:var(--surface);}
.close-x{width:30px; height:30px; border:none; background:var(--surface-2); border-radius:9px; font-size:14px; color:var(--text-muted);}

.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--text-muted); margin-bottom:6px;}
.field .full{width:100%;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
.seg{display:flex; border:1px solid var(--border); border-radius:9px; overflow:hidden;}
.seg button{flex:1; border:none; background:var(--surface); padding:9px; font-size:13px; font-weight:600; color:var(--text-muted);}
.seg button.on{background:var(--primary); color:#fff;}
.checkline{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text);}
.emoji-grid{display:grid; grid-template-columns:repeat(8,1fr); gap:6px;}
.emoji-opt{width:36px; height:36px; border-radius:9px; border:1px solid var(--border); background:var(--surface); font-size:17px; display:flex; align-items:center; justify-content:center;}
.emoji-opt.on{border-color:var(--primary); background:var(--primary-tint);}
.color-grid{display:flex; gap:8px;}
.color-opt{width:40px; height:26px; border-radius:7px; border:2px solid transparent; cursor:pointer;}
.color-opt.on{border-color:var(--text);}
.hint-box{background:var(--info-tint); color:#2A5CB0; padding:10px 12px; border-radius:9px; font-size:12px; line-height:1.5; margin-bottom:14px;}
.net-preview{background:var(--surface-2); border-radius:9px; padding:10px 12px; font-size:12.5px; color:var(--text-muted); margin-top:6px;}
.net-preview b{color:var(--text); font-family:var(--mono);}

/* ---- Toast ---- */
#toastWrap{position:fixed; bottom:22px; right:22px; z-index:200; display:flex; flex-direction:column; gap:8px;}
#ocTooltip{position:fixed; z-index:400; background:#171B21; color:#fff; padding:8px 11px; border-radius:8px; font-size:12px; line-height:1.5; pointer-events:none; box-shadow:0 6px 18px rgba(0,0,0,.25); max-width:220px; display:none;}
#ocTooltip b{font-family:var(--mono); display:block; font-size:12.5px;}
.oc-hoverable{cursor:pointer; transition:opacity .1s;}
.oc-hoverable:hover{opacity:.82;}
.toast{background:var(--text); color:#fff; padding:11px 16px; border-radius:10px; font-size:13px; box-shadow:var(--shadow-md); animation:slideIn .2s ease;}
@keyframes slideIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

/* PDF import */
.dropzone{border:2px dashed var(--border); border-radius:14px; padding:34px; text-align:center; color:var(--text-muted); cursor:pointer;}
.dropzone:hover{border-color:var(--primary); background:var(--primary-tint);}
.dropzone .ic{font-size:26px; margin-bottom:8px;}
.import-table{width:100%; border-collapse:collapse; font-size:12.5px;}
.import-table th{text-align:left; color:var(--text-faint); font-weight:600; font-size:11px; text-transform:uppercase; padding:6px 6px; border-bottom:1px solid var(--border);}
.import-table td{padding:5px 6px; border-bottom:1px solid var(--surface-2); vertical-align:middle;}
.import-table input, .import-table select{width:100%; border:1px solid var(--border); border-radius:6px; padding:5px 6px; font-size:12px;}
.step-dots{display:flex; gap:6px; margin-bottom:4px;}
.step-dots span{width:7px; height:7px; border-radius:50%; background:var(--border);}
.step-dots span.on{background:var(--primary);}
.stat-mini{display:flex; gap:14px; margin:14px 0;}
.stat-mini div{background:var(--surface-2); border-radius:10px; padding:10px 14px; flex:1;}
.stat-mini div b{display:block; font-family:var(--mono); font-size:15px;}
.stat-mini div span{font-size:11px; color:var(--text-faint);}

.mobile-topbar{display:none;}
.mobile-overlay{display:none;}

@media(max-width:880px){
  .topnav-main{padding:10px 14px; flex-wrap:wrap;}
  .topnav-main .searchbox{order:3; max-width:none; width:100%; margin-top:6px;}
  .topnav-main .shortcuts-hint{display:none;}
  .topnav-strip{padding:0 10px 10px;}
  .build-tag{display:none;}
  .brand-text span{display:none;}
  .topbar{ flex-wrap:wrap; gap:8px; padding:10px 14px; }
  .topbar .searchbox{ order:1; max-width:none; width:100%; }
  .topbar > div[style*="flex:1"]{ display:none; }
  .topbar > div[title="Atalhos de teclado"]{ display:none; }
  .content{padding:16px 12px 60px;}
  .grid.g4{grid-template-columns:1fr 1fr; gap:10px;}
  .grid.g3{grid-template-columns:1fr;}
  .grid.g2{grid-template-columns:1fr;}
  .page-head{flex-direction:column; align-items:flex-start; gap:10px;}
  .page-head h1{font-size:19px;}
  .head-actions{width:100%; flex-wrap:wrap;}
  .head-actions .month-switch{order:-1;}
  .filters-bar{flex-direction:column; align-items:stretch;}
  .filters-bar .select, .filters-bar .input, .filters-bar .search-inline{width:100%;}
  .tx-row{flex-wrap:wrap;}
  .tx-actions{opacity:1 !important; gap:6px;}
  .tx-actions button{width:32px; height:32px; font-size:14px;}
  .modal{max-width:calc(100vw - 24px); max-height:calc(100vh - 40px);}
  .modal.wide{max-width:calc(100vw - 24px);}
  .row2, .row3{grid-template-columns:1fr;}
  table{display:block; overflow-x:auto; white-space:nowrap;}
  .cat-grid{grid-template-columns:1fr 1fr;}
  #ocTooltip{display:none !important;}
}
</style>
</head>
<body>

<div class="app" id="app">
  <div style="min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;">
    <div style="width:40px; height:40px; border-radius:50%; border:3px solid var(--surface-2); border-top-color:var(--primary); animation:oc-spin .8s linear infinite;"></div>
    <div style="color:var(--text-faint); font-size:13px;">Carregando orça•me...</div>
  </div>
</div>
<style>@keyframes oc-spin{to{transform:rotate(360deg);}}</style>
<div id="toastWrap"></div>
<div id="ocTooltip"></div>

<script>

async function sbRequestOnce(method, table, opts={}){
  const query = opts.query || '';
  const sep = query.includes('?') ? '&' : '?';
  const url = `${SUPABASE_REST_URL}/${table}${query}${sep}apikey=${SUPABASE_ANON_KEY}`;
  const headers = {};
  if(opts.body) headers['Content-Type'] = 'application/json';
  if(opts.prefer) headers['Prefer'] = opts.prefer;
  const controller = new AbortController();
  const timeoutId = setTimeout(()=>controller.abort(), 12000);
  let res;
  try{
    res = await fetch(url, { method, headers, body: opts.body ? JSON.stringify(opts.body) : undefined, signal: controller.signal });
  }catch(e){
    if(e.name==='AbortError') throw new Error('Tempo esgotado ao conectar com o Supabase (12s)');
    throw e;
  }finally{
    clearTimeout(timeoutId);
  }
  if(!res.ok){
    let msg = 'HTTP '+res.status;
    try{ const j = await res.json(); msg = j.message || j.error_description || JSON.stringify(j); }catch(_){}
    throw new Error(msg);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}
async function sbRequest(method, table, opts={}){
  try{
    return await sbRequestOnce(method, table, opts);
  }catch(e){
    // tenta mais uma vez apos uma pequena pausa, para absorver falhas momentaneas de rede
    if(e instanceof TypeError){
      await new Promise(r=>setTimeout(r,900));
      return await sbRequestOnce(method, table, opts);
    }
    throw e;
  }
}

function validSqlDate(v){
  if(!v || typeof v!=='string') return null;
  const m = v.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return null;
  const mm = parseInt(m[2]), dd = parseInt(m[3]);
  if(mm<1||mm>12||dd<1||dd>31) return null;
  return v;
}

async function loadAll(){
  let allEmpty = true;
  const keys = Object.keys(TABLE_MAP);
  const results = await Promise.all(keys.map(async key=>{
    try{
      const data = await sbRequest('GET', TABLE_MAP[key], {query:'?select=*&order=created_at.asc'});
      return {key, ok:true, data};
    }catch(e){
      return {key, ok:false, error:e};
    }
  }));
  results.forEach(({key, ok, data, error})=>{
    if(ok){
      DB[key] = (data||[]).map(fromDbRow[key]);
      supa = true;
      if(DB[key].length>0) allEmpty = false;
      if(!_persistSnapshot[key]) _persistSnapshot[key] = new Map();
      DB[key].map(toDbRow[key]).forEach(r=>_persistSnapshot[key].set(String(r.id), JSON.stringify(r)));
    } else {
      console.error('Falha ao carregar '+key+' do Supabase:', error);
      window._lastSupaError = (error && error.message) || String(error);
      usingFallbackStorage = true;
      try{ const raw = localStorage.getItem('orcame:'+key); DB[key] = raw?JSON.parse(raw):[]; }catch(_){ DB[key]=[]; }
    }
  });
  // migracao unica: se supabase estava totalmente vazio mas existe dado local antigo, sobe pro supabase
  if(supa && allEmpty && !usingFallbackStorage){
    for(const key of Object.keys(TABLE_MAP)){
      try{
        const raw = localStorage.getItem('orcame:'+key);
        if(raw){ const arr = JSON.parse(raw); if(arr.length>0){ DB[key] = arr; await persist(key); } }
      }catch(_){}
    }
  }
  if(DB.cats.length===0){ DB.cats = DEFAULT_CATS.slice(); await persist('cats'); }
  else {
    let added=false;
    DEFAULT_CATS.forEach(dc=>{ if(!DB.cats.find(c=>c.id===dc.id)){ DB.cats.push(dc); added=true; } });
    if(added) await persist('cats');
  }
  // reclassificacao automatica: lojas conhecidas que ficaram em "Outros" antes das regras existirem
  if(!localStorage.getItem('orcame:reclass-v2-done')){
    let reclassified = false;
    DB.tx.forEach(t=>{
      if(t.type==='despesa' && t.category==='c-outros-d'){
        const guessed = guessCategory(t.description||'');
        if(guessed !== 'c-outros-d'){ t.category = guessed; reclassified = true; }
      }
    });
    if(reclassified) await persist('tx');
    try{ localStorage.setItem('orcame:reclass-v2-done','1'); }catch(_){}
  }
}

const _persistSnapshot = {}; // key -> Map(id -> JSON string) do que já foi confirmado salvo no Supabase

async function persist(key){
  const table = TABLE_MAP[key];
  const rows = DB[key].map(toDbRow[key]);
  if(!_persistSnapshot[key]) _persistSnapshot[key] = new Map();
  const snap = _persistSnapshot[key];

  if(supa){
    try{
      // so envia linhas novas ou que mudaram desde o ultimo salvamento (evita reenviar a tabela inteira toda vez)
      const changed = rows.filter(r=>{ const s=JSON.stringify(r); return snap.get(r.id)!==s; });
      if(changed.length>0){
        await sbRequest('POST', table, {query:'?on_conflict=id', body:changed, prefer:'resolution=merge-duplicates,return=minimal'});
      }
      // deleta so os ids que sumiram do array local (lista tipicamente pequena, mesmo com a tabela grande)
      const currentIds = new Set(rows.map(r=>String(r.id)));
      const deletedIds = Array.from(snap.keys()).filter(id=>!currentIds.has(id));
      if(deletedIds.length>0){
        const idsStr = deletedIds.map(id=>id.replace(/[(),"]/g,'')).join(',');
        await sbRequest('DELETE', table, {query:`?id=in.(${idsStr})`});
      }
      // atualiza o retrato local
      snap.clear();
      rows.forEach(r=>snap.set(String(r.id), JSON.stringify(r)));
      try{ localStorage.setItem('orcame:'+key, JSON.stringify(DB[key])); }catch(_){}
      return true;
    }catch(e){
      console.error('Falha ao salvar '+key+' no Supabase:', e);
      window._lastSupaError = (e && e.message) || String(e);
      usingFallbackStorage = true;
      toast('Erro ao salvar na nuvem: '+window._lastSupaError, 'danger');
      if(document.querySelector('.sidebar-foot')) render();
    }
  }
  try{ localStorage.setItem('orcame:'+key, JSON.stringify(DB[key])); }catch(e){ toast('Não foi possível salvar os dados','danger'); }
  return false;
}
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function getAlerts(){
  const alerts = [];
  DB.tx.filter(t=>t.type==='despesa' && t.status==='pendente' && t.dueDate && t.amount>0).forEach(t=>{
    const d = daysUntil(t.dueDate);
    if(d<0) alerts.push({kind:'atrasado', label:t.description, sub:'Venceu há '+Math.abs(d)+' dia(s)', value:t.amount, urgency:0});
    else if(d<=7) alerts.push({kind:'vencendo', label:t.description, sub: d===0?'Vence hoje':'Vence em '+d+' dia(s)', value:t.amount, urgency:d});
  });
  DB.cards.forEach(c=>{
    if(!c.dueDay) return;
    const today = new Date(); today.setHours(0,0,0,0);
    let due = new Date(today.getFullYear(), today.getMonth(), c.dueDay);
    if(due < today) due = new Date(today.getFullYear(), today.getMonth()+1, c.dueDay);
    const d = Math.round((due-today)/86400000);
    if(d<=7){
      const debtGross = DB.tx.filter(t=>t.type==='despesa'&&t.paymentMethod==='cartao'&&t.cardId===c.id&&t.status==='pendente').reduce((s,t)=>s+t.amount,0);
      const creditsAll = DB.tx.filter(t=>t.type==='receita'&&t.cardId===c.id).reduce((s,t)=>s+t.amount,0);
      const debt = Math.max(0, debtGross-creditsAll);
      if(debt>0) alerts.push({kind:'vencendo', label:'Fatura '+c.name, sub: d===0?'Vence hoje':'Vence em '+d+' dia(s)', value:debt, urgency:d});
    }
  });
  alerts.sort((a,b)=> (a.kind==='atrasado'?-1:0) - (b.kind==='atrasado'?-1:0) || a.urgency-b.urgency);
  return alerts;
}

function toggleAlertsPanel(ev){
  ev.stopPropagation();
  const existing = document.getElementById('alertsPanel');
  if(existing){ existing.remove(); return; }
  const alerts = getAlerts();
  const panel = document.createElement('div');
  panel.id = 'alertsPanel';
  panel.style.cssText = 'position:absolute; top:56px; right:28px; width:320px; background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow-md); z-index:150; max-height:420px; overflow:auto;';
  panel.innerHTML = `

    ${alerts.length===0? `<div style="padding:24px 16px; text-align:center; color:var(--text-faint); font-size:12.5px;">Nenhum vencimento próximo ou atrasado 🎉</div>` :
      alerts.map(a=>`<div style="padding:11px 16px; border-bottom:1px solid var(--surface-2); display:flex; justify-content:space-between; gap:10px;">
        <div><div style="font-weight:600; font-size:12.5px;">${esc(a.label)}</div><div style="font-size:11.5px; color:${a.kind==='atrasado'?'var(--danger)':'var(--warning)'};">${esc(a.sub)}</div></div>
        <div style="font-family:var(--mono); font-size:12.5px; font-weight:600; white-space:nowrap;">${fmtBRL(a.value)}</div>
      </div>`).join('')}
  `;
  document.body.appendChild(panel);
  setTimeout(()=>{
    document.addEventListener('click', function closeOnce(e){
      if(!panel.contains(e.target)){ panel.remove(); document.removeEventListener('click', closeOnce); }
    });
  },0);
}
function checkAutoBackup(){
  const today = new Date();
  if(today.getDate() > 5) return; // so tenta nos primeiros dias do mes
  const mk = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0');
  const last = localStorage.getItem('orcame:lastBackupMonth');
  if(last === mk) return;
  if(DB.tx.length===0 && DB.cards.length===0) return; // nada pra fazer backup ainda
  exportBackup();
  try{ localStorage.setItem('orcame:lastBackupMonth', mk); }catch(_){}
  toast('Backup mensal automático baixado 📥');
}
function exportTransactionsCSV(){
  const rows = [['Data','Tipo','Descrição','Categoria','Forma de Pagamento','Cartão','Parcela','Status','Valor Bruto','IR %','Repasse','Valor Líquido','Observações']];
  DB.tx.forEach(t=>{
    const c = catById(t.category); const card = t.cardId?cardById(t.cardId):null;
    const liquido = t.type==='receita' ? netReceita(t) : t.amount;
    rows.push([
      fmtDateFull(t.date), t.type==='receita'?'Receita':'Despesa', t.description, c?c.name:'',
      t.paymentMethod||'', card?card.name:'', t.installmentTotal?`${t.installmentCurrent}/${t.installmentTotal}`:'',
      t.status||'', String(t.amount).replace('.',','),
      t.type==='receita'?String(t.taxPercent||0).replace('.',','):'',
      t.type==='receita'?String(t.repasseAmount||0).replace('.',','):'',
      String(liquido).replace('.',','), t.notes||''
    ]);
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'orcame-transacoes-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('CSV exportado — abre direto no Excel');
}

function exportBackup(){
  const backup = { exportedAt: new Date().toISOString(), version: APP_VERSION, data: DB };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'orcame-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Backup baixado');
}

const PALETTE = ['#0EA972','#3B7CE0','#F0A833','#E4483A','#7C6CF0','#F0721F','#14B8A6','#EC4899','#84CC16','#64748B','#0B8B5D','#2A5CB0'];
const MONTHS_PT = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MONTHS_SHORT = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

function fmtBRL(v){ v = v||0; const s = Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); return (v<0?'-':'')+'R$ '+s; }
function fmtNum(v){ return (v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function parseISO(iso){ return new Date(iso+'T00:00:00'); }
function fmtDateShort(iso){ if(!iso) return '—'; const d=parseISO(iso); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); }
function fmtDateFull(iso){ if(!iso) return '—'; const d=parseISO(iso); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); }
function monthLabel(d){ return MONTHS_PT[d.getMonth()].charAt(0).toUpperCase()+MONTHS_PT[d.getMonth()].slice(1)+' de '+d.getFullYear(); }
function sameMonth(iso, d){ if(!iso) return false; const t=parseISO(iso); return t.getFullYear()===d.getFullYear() && t.getMonth()===d.getMonth(); }
function txMonthKey(t){
  if(t.paymentMethod==='cartao' && t.invoiceMonth) return t.invoiceMonth;
  return (t.date||'').slice(0,7);
}
function inSelectedMonth(t, monthDate){
  const mk = monthDate.getFullYear()+'-'+String(monthDate.getMonth()+1).padStart(2,'0');
  return txMonthKey(t) === mk;
}
function catById(id){ return DB.cats.find(c=>c.id===id); }
function cardById(id){ return DB.cards.find(c=>c.id===id); }
function catsFor(type){ return DB.cats.filter(c=>c.type===type); }
function netReceita(t){ if(t.type!=='receita') return t.amount; const tax=t.taxPercent||0; const rep=t.repasseAmount||0; return Math.max(0, t.amount*(1-tax/100) - rep); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function daysUntil(iso){ const d=parseISO(iso); const t=new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/86400000); }

let ocTooltipEl = null;
function ocShowTip(evt, label, pct, value){
  if(!ocTooltipEl) ocTooltipEl = document.getElementById('ocTooltip');
  if(!ocTooltipEl) return;
  ocTooltipEl.innerHTML = `${esc(label)}${pct!=null?`<br><span style="color:#9CA3AF;">${pct}</span>`:''}<b>${esc(value)}</b>`;
  ocTooltipEl.style.display = 'block';
  ocMoveTip(evt);
}
function ocMoveTip(evt){
  if(!ocTooltipEl) return;
  const pad = 14;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  const rect = ocTooltipEl.getBoundingClientRect();
  if(x + rect.width > window.innerWidth - 10) x = evt.clientX - rect.width - pad;
  if(y + rect.height > window.innerHeight - 10) y = evt.clientY - rect.height - pad;
  ocTooltipEl.style.left = x+'px';
  ocTooltipEl.style.top = y+'px';
}
function ocHideTip(){ if(ocTooltipEl) ocTooltipEl.style.display = 'none'; }
document.addEventListener('mouseover', function(e){
  const el = e.target.closest('[data-tip-label]');
  if(el) ocShowTip(e, el.getAttribute('data-tip-label'), el.getAttribute('data-tip-pct')||null, el.getAttribute('data-tip-value'));
});
document.addEventListener('mousemove', function(e){
  const el = e.target.closest('[data-tip-label]');
  if(el) ocMoveTip(e);
});
document.addEventListener('mouseout', function(e){
  const el = e.target.closest('[data-tip-label]');
  if(el && !e.relatedTarget?.closest?.('[data-tip-label]')) ocHideTip();
});
function toast(msg, kind){
  const el=document.createElement('div'); el.className='toast'; el.style.maxWidth='420px'; el.style.wordBreak='break-word';
  if(kind==='danger'){
    el.style.background='var(--danger)';
    el.style.display='flex'; el.style.alignItems='flex-start'; el.style.gap='10px';
    el.innerHTML = `<span style="flex:1;">${esc(msg)}</span><button onclick="this.parentElement.remove()" style="background:none;border:none;color:#fff;font-size:15px;cursor:pointer;line-height:1;">✕</button>`;
    document.getElementById('toastWrap').appendChild(el);
    // erros ficam na tela ate o usuario fechar manualmente
  } else {
    el.textContent = msg;
    document.getElementById('toastWrap').appendChild(el);
    setTimeout(()=>el.remove(), 3200);
  }
}

function pagePainel(){
  const m = state.month;
  const txMes = DB.tx.filter(t=>inSelectedMonth(t, m));
  const receitas = txMes.filter(t=>t.type==='receita');
  const despesas = txMes.filter(t=>t.type==='despesa');
  const totalReceitas = receitas.reduce((s,t)=>s+t.amount,0);
  const totalDespesas = despesas.reduce((s,t)=>s+t.amount,0);
  const totalLiquido = receitas.reduce((s,t)=>s+netReceita(t),0);
  const saldo = totalReceitas - totalDespesas;
  const lucroLiquido = totalLiquido - totalDespesas;

  // despesas por categoria — apenas pix/dinheiro/transferência (detalhe de cartão fica na página Cartões)
  const byCat = {};
  despesas.filter(t=>t.amount>0 && t.paymentMethod!=='cartao').forEach(t=>{ byCat[t.category] = (byCat[t.category]||0)+t.amount; });
  const catEntries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const creditosMesTotal = despesas.filter(t=>t.amount<0).reduce((s,t)=>s+Math.abs(t.amount),0);
  const cartoesNetMes = despesas.filter(t=>t.paymentMethod==='cartao').reduce((s,t)=>s+t.amount,0);
  if(cartoesNetMes>0) catEntries.push(['__cartoes__', cartoesNetMes]);

  // receitas por categoria
  const byCatR = {};
  receitas.filter(t=>t.amount>0).forEach(t=>{ byCatR[t.category] = (byCatR[t.category]||0)+netReceita(t); });
  const catEntriesR = Object.entries(byCatR).sort((a,b)=>b[1]-a[1]);

  // proximos vencimentos: cartões (dia de vencimento) + despesas fixas pendentes com dueDate
  const upcoming = [];
  DB.cards.forEach(c=>{
    const debt = DB.tx.filter(t=>t.type==='despesa' && t.paymentMethod==='cartao' && t.cardId===c.id && t.status==='pendente').reduce((s,t)=>s+t.amount,0);
    if(c.dueDay && debt>0){ upcoming.push({label:c.name, sub:'Cartão · vence dia '+c.dueDay, value:debt, kind:'card', cardId:c.id}); }
  });
  despesas.filter(t=>t.status==='pendente' && t.dueDate).forEach(t=>{
    upcoming.push({label:t.description, sub:(catById(t.category)?.name||'')+' · '+fmtDateFull(t.dueDate), value:t.amount, kind:'tx', due:t.dueDate, id:t.id});
  });
  upcoming.sort((a,b)=>(a.due&&b.due)?parseISO(a.due)-parseISO(b.due):0);

  const tsOf = t => {
    const created = t.createdAt ? new Date(t.createdAt).getTime() : 0;
    const paid = t.paidAt ? new Date(t.paidAt).getTime() : 0;
    const best = Math.max(created, paid);
    return best>0 ? best : parseISO(t.date).getTime();
  };
  const recent = [...DB.tx].sort((a,b)=>tsOf(b)-tsOf(a)).slice(0,6);

  // evolução últimos 6 meses
  const evo = [];
  for(let i=5;i>=0;i--){
    const d = new Date(m.getFullYear(), m.getMonth()-i, 1);
    const r = DB.tx.filter(t=>t.type==='receita'&&t.amount>0&&inSelectedMonth(t,d)).reduce((s,t)=>s+netReceita(t),0);
    const de = DB.tx.filter(t=>t.type==='despesa'&&inSelectedMonth(t,d)).reduce((s,t)=>s+t.amount,0);
    evo.push({label:MONTHS_SHORT[d.getMonth()]+' de '+String(d.getFullYear()).slice(2), r, de});
  }

  window._totalDespesasNet = totalDespesas;

              }
              const c=catById(cid); const color=PALETTE[DB.cats.findIndex(x=>x.id===cid)%PALETTE.length];

          const catCompare = {};
          const compareMonths = [0,1,2].map(i=> new Date(m.getFullYear(), m.getMonth()-i, 1));
          DB.tx.filter(t=>t.type==='despesa' && t.amount>0).forEach(t=>{
            const mk = txMonthKey(t);
            compareMonths.forEach(cm=>{
              const cmk = cm.getFullYear()+'-'+String(cm.getMonth()+1).padStart(2,'0');
              if(mk===cmk){ if(!catCompare[t.category]) catCompare[t.category]={}; catCompare[t.category][cmk]=(catCompare[t.category][cmk]||0)+t.amount; }
            });
          });
          const rows = Object.entries(catCompare).map(([cid,byMonth])=>{
            const c = catById(cid);
            const vals = compareMonths.map(cm=>{ const cmk=cm.getFullYear()+'-'+String(cm.getMonth()+1).padStart(2,'0'); return byMonth[cmk]||0; });
            return {cid, c, vals, current:vals[0]};
          }).sort((a,b)=>b.current-a.current).slice(0,6);
          if(rows.length===0) return emptyState('📊','Sem dados suficientes','Precisa de despesas em pelo menos um dos últimos meses.');

            <tbody>${rows.map(r=>`<tr>
              <td style="padding:6px; border-top:1px solid var(--surface-2); font-weight:600;">${r.c?r.c.icon+' '+esc(r.c.name):'—'}</td>

          <div class="donut-wrap" id="chartCatR" style="width:150px;height:150px;flex-shrink:0;position:relative;"></div>
          <div style="flex:1; min-width:0;">
            ${catEntriesR.map(([cid,val])=>{ const c=catById(cid); const pct=totalLiquido? (val/totalLiquido*100):0; const color=PALETTE[DB.cats.findIndex(x=>x.id===cid)%PALETTE.length];
              return `<div class="legend-row"><span class="legend-dot" style="background:${color}"></span><span class="legend-name">${c?c.icon+' '+esc(c.name):'Outros'}</span><span class="legend-pct">${pct.toFixed(1)}%</span><span class="legend-val">${fmtBRL(val)}</span></div>`; }).join('')}
          </div>
        </div>`}

      <div class="card card-pad">
        <div class="section-title"><h3>Top Origens de Receita</h3><span class="meta">quem/o que mais rende, no mês</span></div>
        ${(()=>{
          const byOrigin = {};
          receitas.filter(t=>t.amount>0).forEach(t=>{ byOrigin[t.description] = (byOrigin[t.description]||0)+netReceita(t); });
          const originEntries = Object.entries(byOrigin).sort((a,b)=>b[1]-a[1]).slice(0,8);
          if(originEntries.length===0) return emptyState('🧾','Nenhuma receita neste mês','As origens de receita aparecem aqui — útil pra ver, por exemplo, qual paciente ou cliente rende mais.');
          return originEntries.map(([name,val])=>{ const pct=totalLiquido?(val/totalLiquido*100):0;
            return `<div class="legend-row"><span class="legend-name">${esc(name)}</span><span class="legend-pct">${pct.toFixed(1)}%</span><span class="legend-val">${fmtBRL(val)}</span></div>`; }).join('');

          upcoming.slice(0,6).map(u=>`<div class="tx-row"><div class="tx-ic out">📅</div><div class="tx-main"><div class="tx-title">${esc(u.label)}</div><div class="tx-sub">${esc(u.sub)}</div></div><div class="tx-amt down">${fmtBRL(u.value)}</div>${u.kind==='tx'?`<button onclick="quickMarkPaid('${u.id}')" title="Marcar como pago" style="width:28px; height:28px; border:none; background:var(--primary-tint); color:var(--primary-dark); border-radius:7px; font-size:13px; flex-shrink:0; margin-left:8px;">✓</button>`:`<button onclick="markCardInvoicePaid('${u.cardId}')" title="Marcar fatura como paga" style="width:28px; height:28px; border:none; background:var(--primary-tint); color:var(--primary-dark); border-radius:7px; font-size:13px; flex-shrink:0; margin-left:8px;">✓</button>`}</div>`).join('')}

function emptyState(ic,b,s){ return `<div class="empty-state"><div class="ic">${ic}</div><b>${esc(b)}</b><span>${esc(s)}</span></div>`; }

function txRow(t, selectable){
  const c = catById(t.category);
  const card = t.cardId ? cardById(t.cardId) : null;
  const isCredit = t.type==='despesa' && t.amount<0;
  const parts = [c?c.name:'—'];
  if(t.paymentMethod==='cartao' && card) parts.push(card.name);
  else if(t.paymentMethod) parts.push(t.paymentMethod.toUpperCase());
  parts.push(fmtDateShort(t.date));
  const displayAmt = t.type==='receita' ? netReceita(t) : -t.amount; // negativo = credito, sinal correto automaticamente
  const checked = state.selectedTx && state.selectedTx.has(t.id);
  return `<div class="tx-row">
    ${selectable?`<input type="checkbox" style="margin-right:4px; width:16px; height:16px; flex-shrink:0;" ${checked?'checked':''} onchange="toggleTxSelect('${t.id}')">`:''}
    <div class="tx-ic ${(t.type==='receita'||isCredit)?'in':'out'}">${isCredit?'🔄':(c?c.icon:(t.type==='receita'?'💰':'🧾'))}</div>
    <div class="tx-main">
      <div class="tx-title-row"><span class="tx-title">${esc(t.description)}</span>${isCredit?'<span class="badge badge-fixa">Estorno/Crédito</span>':''}${t.recurring?'<span class="badge badge-fixa">Fixa</span>':''}${t.installmentTotal?`<span class="badge badge-parcela">${t.installmentCurrent}/${t.installmentTotal}</span>`:''}${t.status==='pendente'?'<span class="badge badge-pendente">Pendente</span>':t.status==='pago'?'<span class="badge badge-pago">Pago</span>':''}</div>
      <div class="tx-sub">${parts.join(' · ')}</div>
    </div>
    <div class="tx-amt ${displayAmt>=0?'up':'down'}">${displayAmt>=0?'+':''}${fmtBRL(displayAmt)}</div>
    ${t.status==='pendente'?`<button onclick="quickMarkPaid('${t.id}')" title="${t.type==='receita'?'Marcar como recebido':'Marcar como pago'}" style="width:28px; height:28px; border:none; background:var(--primary-tint); color:var(--primary-dark); border-radius:7px; font-size:13px; flex-shrink:0;">✓</button>`:''}
    <div class="tx-actions"><button onclick="openTxModal('${t.id}')" title="Editar">✎</button><button onclick="deleteTx('${t.id}')" title="Excluir">🗑</button></div>
  </div>`;
}
function quickMarkPaid(id){
  const t = DB.tx.find(x=>x.id===id);
  if(!t) return;
  t.status = 'pago';
  t.paidAt = new Date().toISOString();
  persist('tx').then(()=>{ toast((t.type==='receita'?'Recebido':'Pago')+': '+t.description); renderPage(); });
}
function markCardInvoicePaid(cardId){
  const card = cardById(cardId);
  const pendentes = DB.tx.filter(t=>t.type==='despesa' && t.paymentMethod==='cartao' && t.cardId===cardId && t.status==='pendente');
  if(pendentes.length===0) return;
  confirmAction(`Marcar toda a fatura pendente do ${card?card.name:'cartão'} (${pendentes.length} lançamento(s)) como paga?`, ()=>{
    const now = new Date().toISOString();
    pendentes.forEach(t=>{ t.status='pago'; t.paidAt=now; });
    persist('tx').then(()=>{ closeModal(); toast('Fatura marcada como paga'); renderPage(); });
  }, {label:'Confirmar', danger:false});
}
function toggleTxSelect(id){
  if(!state.selectedTx) state.selectedTx = new Set();
  if(state.selectedTx.has(id)) state.selectedTx.delete(id); else state.selectedTx.add(id);
  renderPage();
}
function toggleSelectAllVisible(ids){
  if(!state.selectedTx) state.selectedTx = new Set();
  const allSelected = ids.every(id=>state.selectedTx.has(id));
  if(allSelected){ ids.forEach(id=>state.selectedTx.delete(id)); }
  else { ids.forEach(id=>state.selectedTx.add(id)); }
  renderPage();
}

/* ============================ TRANSAÇÕES ============================ */
function getFilteredTxList(scope){
  let list = [...DB.tx];
  if(scope==='cartao') list = list.filter(t=>t.paymentMethod==='cartao');
  else if(scope==='nao-cartao') list = list.filter(t=>t.paymentMethod!=='cartao');
  if(state.txMonthFilterOn) list = list.filter(t=>inSelectedMonth(t, state.month));
  if(state.txFilterType!=='todos') list = list.filter(t=>t.type===state.txFilterType);
  if(state.txFilterStatus!=='todos') list = list.filter(t=>t.status===state.txFilterStatus);
  if(state.txFilterCard!=='todos') list = list.filter(t=>t.cardId===state.txFilterCard);
  if(state.txFilterMin!=null && state.txFilterMin!=='') list = list.filter(t=>Math.abs(t.amount)>=parseFloat(state.txFilterMin));
  if(state.txFilterMax!=null && state.txFilterMax!=='') list = list.filter(t=>Math.abs(t.amount)<=parseFloat(state.txFilterMax));
  if(state.search.trim()){
    const q = state.search.toLowerCase();
    list = list.filter(t=> t.description.toLowerCase().includes(q) || (catById(t.category)?.name||'').toLowerCase().includes(q));
  }
  list.sort((a,b)=>parseISO(b.date)-parseISO(a.date));
  return list;
}
function toggleTxMonthFilter(){ state.txMonthFilterOn = !state.txMonthFilterOn; renderPage(); }

  opts = opts || {};
  const list = getFilteredTxList(scope);
  const sumReceitas = list.filter(t=>t.type==='receita').reduce((s,t)=>s+netReceita(t),0);
  const sumDespesas = list.filter(t=>t.type==='despesa').reduce((s,t)=>s+t.amount,0);
  return `
    ${list.length>0 ? `<div class="card card-pad" style="margin-bottom:14px; display:flex; gap:24px; flex-wrap:wrap;">
      ${sumReceitas>0?`<div><div style="font-size:10.5px; color:var(--text-faint); text-transform:uppercase; font-weight:700;">Soma filtrada · Receitas</div><div style="font-family:var(--mono); font-size:17px; font-weight:700; color:var(--primary-dark);">${fmtBRL(sumReceitas)}</div></div>`:''}
      ${sumDespesas!==0?`<div><div style="font-size:10.5px; color:var(--text-faint); text-transform:uppercase; font-weight:700;">Soma filtrada · Despesas</div><div style="font-family:var(--mono); font-size:17px; font-weight:700; color:var(--danger);">${fmtBRL(sumDespesas)}</div></div>`:''}
      ${(sumReceitas>0 && sumDespesas!==0)?`<div><div style="font-size:10.5px; color:var(--text-faint); text-transform:uppercase; font-weight:700;">Saldo</div><div style="font-family:var(--mono); font-size:17px; font-weight:700;">${fmtBRL(sumReceitas-sumDespesas)}</div></div>`:''}
    </div>` : ''}
    <div class="filters-bar">
      <div class="search-inline">🔎<input id="txSearchInline" placeholder="Buscar por descrição ou categoria..." value="${esc(state.search)}" oninput="onSearch(this.value)"></div>
      <button class="btn btn-sm ${state.txMonthFilterOn?'btn-primary':'btn-outline'}" onclick="toggleTxMonthFilter()">📅 ${state.txMonthFilterOn?'Filtrando por mês':'Todos os períodos'}</button>
      ${state.txMonthFilterOn?monthNav():''}
      <select class="select" onchange="state.txFilterType=this.value; renderPage();">
        <option value="todos" ${state.txFilterType==='todos'?'selected':''}>Todos os tipos</option>
        <option value="receita" ${state.txFilterType==='receita'?'selected':''}>Receitas</option>
        <option value="despesa" ${state.txFilterType==='despesa'?'selected':''}>Despesas</option>
      </select>
      <select class="select" onchange="state.txFilterStatus=this.value; renderPage();">
        <option value="todos" ${state.txFilterStatus==='todos'?'selected':''}>Status: todos</option>
        <option value="pendente" ${state.txFilterStatus==='pendente'?'selected':''}>Pendente</option>
        <option value="pago" ${state.txFilterStatus==='pago'?'selected':''}>Pago/Recebido</option>
      </select>
      ${opts.showCardFilter?`<select class="select" onchange="state.txFilterCard=this.value; renderPage();">
        <option value="todos">Cartão: todos</option>
        ${DB.cards.map(c=>`<option value="${c.id}" ${state.txFilterCard===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
      </select>`:''}
      <input class="input" type="number" step="0.01" placeholder="Valor mín." style="width:110px;" value="${state.txFilterMin||''}" onchange="state.txFilterMin=this.value; renderPage();">
      <input class="input" type="number" step="0.01" placeholder="Valor máx." style="width:110px;" value="${state.txFilterMax||''}" onchange="state.txFilterMax=this.value; renderPage();">
      ${(state.txFilterMin||state.txFilterMax)?`<button class="btn btn-sm btn-ghost" onclick="state.txFilterMin=''; state.txFilterMax=''; renderPage();">✕ limpar valores</button>`:''}
      <div style="flex:1"></div>
      <button class="btn btn-outline" onclick="exportTransactionsCSV()">⬇️ Exportar CSV</button>
    </div>
    ${list.length>0? `<div style="display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; align-items:center;">
      <label class="checkline" style="margin-right:4px;"><input type="checkbox" ${list.length>0 && list.every(t=>state.selectedTx&&state.selectedTx.has(t.id))?'checked':''} onchange="toggleSelectAllVisible(${JSON.stringify(list.map(t=>t.id)).replace(/"/g,"'")})"> Selecionar todas</label>
      <button class="btn btn-sm btn-outline" onclick="bulkMarkPaid()">✓ Marcar estas ${list.length} como pagas</button>
      ${opts.showCardFilter?`<button class="btn btn-sm btn-outline" onclick="bulkSetInvoiceMonth()">📅 Definir mês de fatura destas ${list.length}</button>`:''}
      <button class="btn btn-sm btn-danger-ghost" onclick="bulkDelete()">🗑 Excluir estas ${list.length}</button>
      ${state.selectedTx && state.selectedTx.size>0 ? `
      <span style="width:1px; height:20px; background:var(--border); margin:0 4px;"></span>
      <span style="font-size:12.5px; color:var(--text-muted); font-weight:600;">${state.selectedTx.size} selecionada(s):</span>
      <button class="btn btn-sm btn-primary" onclick="bulkChangeCategory()">🏷️ Alterar categoria</button>
      ${opts.showCardFilter?`<button class="btn btn-sm btn-outline" onclick="bulkChangeCard()">💳 Mudar cartão</button>`:''}
      ` : ''}
    </div>` : ''}
    <div class="card card-pad">
      ${list.length===0? emptyState('🧾','Nenhuma transação encontrada','Ajuste os filtros.') : list.map(t=>txRow(t,true)).join('')}
    </div>
  `;
}
function pageTransacoes(){
  state.txScope = 'nao-cartao';
  const list = getFilteredTxList('nao-cartao');
  return `
    <div class="page-head">
      <div><h1>Transações</h1><p>${list.length} registro(s) · pix, dinheiro e transferência${state.txMonthFilterOn?' · '+monthLabel(state.month):' · todos os períodos'}</p></div>
      <div class="head-actions">
        <button class="btn btn-outline" onclick="openDuplicateMonthModal()">📋 Duplicar mês</button>
        <button class="btn btn-primary" onclick="openTxModal(null)">+ Nova</button>
      </div>
    </div>
    ${renderTxFiltersAndList('nao-cartao', {showCardFilter:false})}
  `;
}
function currentTxFilterIds(){
  return getFilteredTxList(state.txScope||'all').map(t=>t.id);
}
function bulkChangeCategory(){
  const ids = Array.from(state.selectedTx||[]);
  if(ids.length===0) return;
  const sample = DB.tx.find(t=>ids.includes(t.id));
  const type = sample ? sample.type : 'despesa';
  openModal(`
    <div class="modal" style="max-width:380px;">
      <div class="modal-head"><h3>Alterar categoria</h3><button class="close-x" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <div class="hint-box">Aplica a categoria escolhida às ${ids.length} transações selecionadas, e o sistema vai lembrar essa regra para os mesmos estabelecimentos em importações futuras.</div>
        <div class="field"><label>Nova categoria</label><select class="select full" id="f_bulkCat">${catsFor(type).map(c=>`<option value="${c.id}">${c.icon} ${esc(c.name)}</option>`).join('')}</select></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="applyBulkCategory(${JSON.stringify(ids).replace(/"/g,"'")})">Aplicar</button>
      </div>
    </div>
  `);
}
function applyBulkCategory(ids){
  const newCat = document.getElementById('f_bulkCat').value;
  const learnedDescs = new Set();
  DB.tx.forEach(t=>{
    if(ids.includes(t.id)){
      t.category = newCat;
      if(t.type==='despesa' && !learnedDescs.has(normalizeMerchant(t.description))){
        learnMerchantRule(t.description, newCat, 'despesa');
        learnedDescs.add(normalizeMerchant(t.description));
      }
    }
  });
  persist('tx').then(()=>{ closeModal(); state.selectedTx=new Set(); toast(ids.length+' transações atualizadas'); renderPage(); });
}
function bulkChangeCard(){
  const ids = Array.from(state.selectedTx||[]);
  if(ids.length===0) return;
  openModal(`
    <div class="modal" style="max-width:380px;">
      <div class="modal-head"><h3>Mudar cartão</h3><button class="close-x" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <div class="hint-box">Move as ${ids.length} transações selecionadas para o cartão escolhido.</div>
        <div class="field"><label>Novo cartão</label><select class="select full" id="f_bulkCard">${DB.cards.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="applyBulkCard(${JSON.stringify(ids).replace(/"/g,"'")})">Aplicar</button>
      </div>
    </div>
  `);
}
function applyBulkCard(ids){
  const newCardId = document.getElementById('f_bulkCard').value;
  DB.tx.forEach(t=>{ if(ids.includes(t.id)){ t.cardId = newCardId; t.paymentMethod = 'cartao'; } });
  persist('tx').then(()=>{ closeModal(); state.selectedTx=new Set(); toast(ids.length+' transações movidas de cartão'); renderPage(); });
}
function bulkDelete(){
  const ids = currentTxFilterIds();
  confirmAction(`Excluir ${ids.length} transação(ões) filtrada(s)? Essa ação não pode ser desfeita.`, ()=>{
    DB.tx = DB.tx.filter(t=>!ids.includes(t.id));
    persist('tx').then(()=>{ toast(ids.length+' transação(ões) excluída(s)'); renderPage(); });
  });
}
function bulkMarkPaid(){
  const ids = currentTxFilterIds();
  confirmAction(`Marcar ${ids.length} transação(ões) filtrada(s) como pagas/recebidas?`, ()=>{
    const now = new Date().toISOString();
    DB.tx.forEach(t=>{ if(ids.includes(t.id)){ t.status='pago'; t.paidAt=now; } });
    persist('tx').then(()=>{ toast('Status atualizado em massa'); renderPage(); });
  }, {label:'Confirmar', danger:false});
}
function bulkSetInvoiceMonth(){
  const ids = currentTxFilterIds();
  openModal(`
    <div class="modal" style="max-width:380px;">
      <div class="modal-head"><h3>Definir mês da fatura</h3><button class="close-x" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <div class="hint-box">Isso ajusta apenas o mês usado para agrupar a fatura no cartão (útil quando as datas das compras caem em meses diferentes do fechamento). Aplica-se às ${ids.length} transações filtradas.</div>
        <div class="field"><label>Mês da fatura</label><input class="input full" id="f_bulkMonth" type="month" value="${state.month.getFullYear()}-${String(state.month.getMonth()+1).padStart(2,'0')}"></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="applyBulkInvoiceMonth(${JSON.stringify(ids).replace(/"/g,"'")})">Aplicar</button>
      </div>
    </div>
  `);
}
function applyBulkInvoiceMonth(ids){
  const mk = document.getElementById('f_bulkMonth').value;
  if(!mk){ toast('Selecione um mês','danger'); return; }
  DB.tx.forEach(t=>{ if(ids.includes(t.id)) t.invoiceMonth = mk; });
  persist('tx').then(()=>{ closeModal(); toast('Mês de fatura atualizado'); renderPage(); });
}

const CARD_COLORS = [{k:'orange',c:'cc-orange'},{k:'navy',c:'cc-navy'},{k:'violet',c:'cc-violet'},{k:'green',c:'cc-green'}];
function pageCartoes(){
  if(state.cartoesView==='extrato') return pageCartaoExtrato();
  const mk = state.month.getFullYear()+'-'+String(state.month.getMonth()+1).padStart(2,'0');
  const byCardOverview = {};
  DB.tx.filter(t=>t.type==='despesa' && t.paymentMethod==='cartao' && t.cardId && (t.invoiceMonth||t.date.slice(0,7))===mk)
    .forEach(t=>{ byCardOverview[t.cardId] = (byCardOverview[t.cardId]||0)+t.amount; });
  const cardOverviewEntries = Object.entries(byCardOverview).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]);
  window._cardOverviewData = cardOverviewEntries;
  const totalTodosCartoes = cardOverviewEntries.reduce((s,e)=>s+e[1],0);

  const despesasCartaoMes = DB.tx.filter(t=>t.type==='despesa' && t.amount>0 && t.paymentMethod==='cartao' && (t.invoiceMonth||t.date.slice(0,7))===mk);
  const byCatCartao = {};
  despesasCartaoMes.forEach(t=>{ byCatCartao[t.category] = (byCatCartao[t.category]||0)+t.amount; });
  const catCartaoEntries = Object.entries(byCatCartao).sort((a,b)=>b[1]-a[1]);
  window._catCartaoData = catCartaoEntries;
  const totalDespesasCartaoGross = despesasCartaoMes.reduce((s,t)=>s+t.amount,0);

  const byEstCard = {};
  despesasCartaoMes.forEach(t=>{ byEstCard[t.description] = (byEstCard[t.description]||0)+t.amount; });
  const estCardEntries = Object.entries(byEstCard).sort((a,b)=>b[1]-a[1]).slice(0,10);

  return `
    <div class="page-head">
      <div><h1>Cartões de Crédito</h1><p>${DB.cards.length} cartão(ões) cadastrado(s) · fatura de ${monthLabel(state.month)}</p></div>
      <div class="head-actions">${monthNav()}<button class="btn btn-outline" onclick="state.txFilterCard='todos'; state.cartoesView='extrato'; renderPage();">📋 Ver extrato</button><button class="btn btn-primary" onclick="openCardModal(null)">+ Novo cartão</button></div>
    </div>
    ${DB.cards.length>1 ? `
    <div class="card card-pad" style="margin-bottom:16px;">
      <div class="section-title"><h3>Visão Geral dos Cartões</h3><span class="meta">% de gasto por cartão, fatura de ${monthLabel(state.month)}</span></div>
      ${cardOverviewEntries.length===0? emptyState('💳','Nenhum gasto no cartão neste mês',' ') : `
      <div style="display:flex; gap:20px; align-items:center;">
        <div class="donut-wrap" id="chartCardOverview" style="width:150px;height:150px;flex-shrink:0;position:relative;"></div>
        <div style="flex:1; min-width:0;">
          ${cardOverviewEntries.map(([cid,val])=>{ const c=cardById(cid); const pct=totalTodosCartoes?(val/totalTodosCartoes*100):0; const color=PALETTE[DB.cards.findIndex(x=>x.id===cid)%PALETTE.length];
            return `<div class="legend-row"><span class="legend-dot" style="background:${color}"></span><span class="legend-name">${c?esc(c.name):'—'}</span><span class="legend-pct" style="font-weight:700; font-size:14px; color:var(--text);">${pct.toFixed(1)}%</span><span class="legend-val">${fmtBRL(val)}</span></div>`; }).join('')}
        </div>
      </div>`}
    </div>` : ''}

    ${DB.cards.length>0 ? `
    <div class="grid g2" style="margin-bottom:16px;">
      <div class="card card-pad">
        <div class="section-title"><h3>Despesas por Categoria nos Cartões</h3><span class="meta">${DB.cards.length>1?'BTG + Revolut juntos, ':''}fatura de ${monthLabel(state.month)}</span></div>
        ${catCartaoEntries.length===0? emptyState('🍕','Nenhuma despesa no cartão neste mês',' ') : `
        <div style="display:flex; gap:20px; align-items:center;">
          <div class="donut-wrap" id="chartCatCartao" style="width:150px;height:150px;flex-shrink:0;position:relative;"></div>
          <div style="flex:1; min-width:0;">
            ${catCartaoEntries.map(([cid,val])=>{ const c=catById(cid); const pct=totalDespesasCartaoGross?(val/totalDespesasCartaoGross*100):0; const color=PALETTE[DB.cats.findIndex(x=>x.id===cid)%PALETTE.length];
              return `<div class="legend-row"><span class="legend-dot" style="background:${color}"></span><span class="legend-name">${c?c.icon+' '+esc(c.name):'Outros'}</span><span class="legend-pct">${pct.toFixed(1)}%</span><span class="legend-val">${fmtBRL(val)}</span></div>`; }).join('')}
          </div>
        </div>`}
      </div>
      <div class="card card-pad">
        <div class="section-title"><h3>Estabelecimentos nos Cartões</h3><span class="meta">top 10, fatura de ${monthLabel(state.month)}</span></div>
        ${estCardEntries.length===0? emptyState('🛒','Nenhum gasto no cartão neste mês',' ') : `
        <div style="display:flex; flex-direction:column; gap:10px;">
        ${(()=>{ const maxVal = Math.max(...estCardEntries.map(e=>e[1]),1); return estCardEntries.map(([name,val],i)=>{ const pct = totalDespesasCartaoGross? (val/totalDespesasCartaoGross*100):0; const barPct=(val/maxVal*100); const color=PALETTE[i%PALETTE.length];
          return `<div>
            <div style="display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px;"><span style="font-weight:600;">${esc(name)}</span><span style="font-family:var(--mono); color:var(--text-muted);">${pct.toFixed(1)}% · ${fmtBRL(val)}</span></div>
            <div class="progress-track oc-hoverable" data-tip-label="${esc(name)}" data-tip-pct="${pct.toFixed(1)}% do total nos cartões" data-tip-value="${esc(fmtBRL(val))}"><div class="progress-fill" style="width:${barPct}%; background:${color}"></div></div>
          </div>`; }).join(''); })()}
        </div>`}
      </div>
    </div>
    ` : ''}
    ${DB.cards.length===0? `<div class="card">${emptyState('💳','Nenhum cartão cadastrado','Cadastre seus cartões para acompanhar fatura, limite e vencimento.')}</div>` : `
    <div class="grid g3">
      ${DB.cards.map(c=>{
        const debtGross = DB.tx.filter(t=>t.type==='despesa'&&t.paymentMethod==='cartao'&&t.cardId===c.id&&t.status==='pendente').reduce((s,t)=>s+t.amount,0);
        const creditsAll = DB.tx.filter(t=>t.type==='receita'&&t.cardId===c.id).reduce((s,t)=>s+t.amount,0);
        const debtTotal = Math.max(0, debtGross - creditsAll);
        const invoiceTx = DB.tx.filter(t=>t.type==='despesa'&&t.paymentMethod==='cartao'&&t.cardId===c.id&&(t.invoiceMonth||t.date.slice(0,7))===mk);
        const faturaGross = invoiceTx.reduce((s,t)=>s+t.amount,0);
        const creditsMes = DB.tx.filter(t=>t.type==='receita'&&t.cardId===c.id&&inSelectedMonth(t,state.month)).reduce((s,t)=>s+t.amount,0);
        const faturaMes = faturaGross - creditsMes;
        const compras = invoiceTx.length;
        const colorClass = (CARD_COLORS.find(x=>x.k===c.color)||CARD_COLORS[0]).c;
        return `<div>
          <div class="ccard-wrap ${colorClass} ccard" onclick="openCardDetail('${c.id}')">
            <div><div class="bank">${esc(c.bank||'')}</div><div class="name">${esc(c.name)}</div></div>
            <div class="digits">•••• ${esc(c.lastDigits||'0000')}</div>
          </div>
          <div class="card" style="border-top:none; border-top-left-radius:0; border-top-right-radius:0; margin-top:-1px;">
            ${c.limit>0? (()=>{ const pct=Math.min(100,(debtTotal/c.limit*100)); const color=pct<60?'var(--primary)':pct<85?'var(--warning)':'var(--danger)';
              return `<div style="padding:12px 16px 0;"><div style="display:flex; justify-content:space-between; font-size:11px; color:var(--text-faint); margin-bottom:5px;"><span>Limite usado</span><span>${pct.toFixed(0)}% de ${fmtBRL(c.limit)}</span></div><div class="progress-track oc-hoverable" data-tip-label="${esc(c.name)} — limite usado" data-tip-pct="${pct.toFixed(1)}% do limite" data-tip-value="${esc(fmtBRL(debtTotal))}"><div class="progress-fill" style="width:${pct}%; background:${color}"></div></div></div>`; })() : ''}
            <div class="ccard-foot" style="padding:12px 16px;">
              <div>Dívida Atual<b class="down">${fmtBRL(debtTotal)}</b></div>
              <div>Fatura de ${MONTHS_SHORT[state.month.getMonth()]}<b>${fmtBRL(faturaMes)}</b>${creditsMes>0?`<span style="display:block;font-size:10px;color:var(--primary-dark);font-weight:600;">− ${fmtBRL(creditsMes)} em créditos</span>`:''}</div>
              <div>Compras<b>${compras}</b></div>
            </div>
            <div class="card-actions-row" style="padding:0 14px 12px; flex-wrap:wrap;">
              <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation(); openCardModal('${c.id}')">✎ Editar</button>
              <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation(); deleteCard('${c.id}')">🗑</button>
              <button class="btn btn-sm btn-danger-ghost" onclick="event.stopPropagation(); deleteInvoiceMonth('${c.id}')">🗑 Excluir fatura de ${MONTHS_SHORT[state.month.getMonth()]}</button>
              <button class="btn btn-sm btn-outline" onclick="event.stopPropagation(); openCardDetail('${c.id}')">Ver detalhes ›</button>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>`}
  `;
}

function saveParceira(id){
  const nome = document.getElementById('f_pcName').value.trim();
  const rate = parseFloat(document.getElementById('f_pcRate').value);
  const pix = document.getElementById('f_pcPix').value.trim();
  if(!nome){ toast('Informe o nome da parceira','danger'); return; }
  if(!rate || rate<=0){ toast('Informe o valor do atendimento','danger'); return; }
  const existing = id ? DB.templates.find(x=>x.id===id) : null;
  const obj = {
    id: id||uid(), type:'receita', title:nome, category:'c-paciente', billingMode:'parceira',
    sessionRate:rate, pixKey:pix, paymentMethod: existing?existing.paymentMethod:'pix', cardId: existing?existing.cardId:'',
    recurring:false, services:[], irPercent: existing?existing.irPercent:'', repassePercent: existing?existing.repassePercent:'', defaultAmount:'',
  };
  const idx = DB.templates.findIndex(x=>x.id===obj.id);
  if(idx>=0) DB.templates[idx]=obj; else DB.templates.push(obj);
  persist('templates').then(()=>{ closeModal(); toast('Parceira salva'); renderPage(); });
}

function saveTemplate(){
  const title = document.getElementById('f_tpltitle').value.trim();
  if(!title){ toast('Informe um nome','danger'); return; }
  const t = state.editing;
  const bm = t.type==='receita' ? (t.billingMode||'fixo') : 'fixo';
  const pm = document.getElementById('f_tplpm').value;
  const obj = {
    id:t.id||uid(), type:t.type, title, category:document.getElementById('f_tplcat').value,
    paymentMethod: pm, cardId: pm==='cartao' ? document.getElementById('f_tplcard').value : '',
    recurring: document.getElementById('f_tplrecurring').checked,
    billingMode: bm, defaultAmount:'', sessionRate:'', irPercent:'', repassePercent:'', services:[],
  };
  if(bm==='fixo'){
    obj.defaultAmount = parseFloat(document.getElementById('f_tplamount').value)||'';
  } else if(bm==='atendimento'){
    { const srVal = document.getElementById('f_tplsessionrate').value; obj.sessionRate = srVal===''? '' : (parseFloat(srVal)||0); }
    obj.irPercent = parseFloat(document.getElementById('f_tplir').value)||0;
    obj.repassePercent = document.getElementById('f_tplrepassepct').value!=='' ? parseFloat(document.getElementById('f_tplrepassepct').value) : '';
  } else if(bm==='multiplo'){

function computeGoalProjection(g){
  const i = (g.type==='juros' ? (parseFloat(g.monthlyRate)||0) : 0) / 100;
  const PV = parseFloat(g.currentValue)||0;
  const FV = parseFloat(g.targetValue)||0;
  const result = {months:null, requiredPMT:null, reached: PV>=FV};
  if(result.reached) return result;
  if(g.mode==='porAporte'){
    const PMT = parseFloat(g.monthlyContribution)||0;
    if(PMT<=0 && i===0){ result.months = Infinity; return result; }
    if(i===0){ result.months = Math.ceil((FV-PV)/PMT); return result; }
    const numerator = FV*i + PMT;
    const denominator = PV*i + PMT;
    if(denominator<=0 || numerator/denominator<=0){ result.months = Infinity; return result; }
    result.months = Math.ceil(Math.log(numerator/denominator)/Math.log(1+i));
  } else {
    const months = parseInt(g.targetMonths)||0;
    result.months = months;
    if(months<=0){ result.requiredPMT = null; return result; }
    if(i===0){ result.requiredPMT = (FV-PV)/months; return result; }
    const x = Math.pow(1+i, months);
    result.requiredPMT = (FV - PV*x) / ((x-1)/i);
  }
  return result;
}
