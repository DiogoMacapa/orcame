function pageRelatoriosGeral(){
  const anoAtual = state.relatorioAno || new Date().getFullYear();
  const despesasAno = DB.tx.filter(t=>t.type==='despesa' && t.amount>0 && txMonthKey(t).startsWith(String(anoAtual)));
  const receitasAno = DB.tx.filter(t=>t.type==='receita' && t.amount>0 && txMonthKey(t).startsWith(String(anoAtual)));
  const anoCatMap = {};
  despesasAno.forEach(t=>{ anoCatMap[t.category] = (anoCatMap[t.category]||0)+t.amount; });
  const anoCatRows = Object.entries(anoCatMap).map(([cid,val])=>({cid, val, c:catById(cid)})).sort((a,b)=>b.val-a.val);
  const totalDespesasAno = despesasAno.reduce((s,t)=>s+t.amount,0);
  const totalReceitasAno = receitasAno.reduce((s,t)=>s+netReceita(t),0);
  const anoMonthly = [];
  for(let m=0;m<12;m++){
    const mk = anoAtual+'-'+String(m+1).padStart(2,'0');
    const de = despesasAno.filter(t=>txMonthKey(t)===mk).reduce((s,t)=>s+t.amount,0);
    const re = receitasAno.filter(t=>txMonthKey(t)===mk).reduce((s,t)=>s+netReceita(t),0);
    anoMonthly.push({label:MONTHS_SHORT[m], de, r:re});
  }
  window._anoEvoData = anoMonthly;

  // comparativo mensal completo por categoria, ultimos 6 meses
  const cmpMonths = [0,1,2,3,4,5].map(i=> new Date(state.month.getFullYear(), state.month.getMonth()-i, 1)).reverse();
  const cmpMap = {};
  DB.tx.filter(t=>t.type==='despesa' && t.amount>0).forEach(t=>{
    const mk2 = txMonthKey(t);
    cmpMonths.forEach(cm=>{ const cmk=cm.getFullYear()+'-'+String(cm.getMonth()+1).padStart(2,'0');
      if(mk2===cmk){ if(!cmpMap[t.category]) cmpMap[t.category]={}; cmpMap[t.category][cmk]=(cmpMap[t.category][cmk]||0)+t.amount; }
    });
  });
  const cmpRows = Object.entries(cmpMap).map(([cid,byMonth])=>{
    const c = catById(cid);
    const vals = cmpMonths.map(cm=>{ const cmk=cm.getFullYear()+'-'+String(cm.getMonth()+1).padStart(2,'0'); return byMonth[cmk]||0; });
    const total = vals.reduce((s,v)=>s+v,0);
    return {cid, c, vals, total};
  }).sort((a,b)=>b.total-a.total);
  const cmpTotals = cmpMonths.map((cm,i)=> cmpRows.reduce((s,r)=>s+r.vals[i],0));


  const despesas = filterByPeriodo(DB.tx.filter(t=>t.type==='despesa'));
  const byEst = {};
  despesas.forEach(t=>{
    const key = (t.description||'—').trim();
    if(!byEst[key]) byEst[key] = {count:0,total:0, category:t.category};
    byEst[key].count++; byEst[key].total += t.amount;
  });
  const totalGeral = despesas.reduce((s,t)=>s+t.amount,0);
  let estRows = Object.entries(byEst).map(([name,v])=>({name,...v, pct: totalGeral?v.total/totalGeral*100:0}));
  estRows.sort((a,b)=>b.total-a.total);
  if(state.search.trim()){ const q=state.search.toLowerCase(); estRows = estRows.filter(r=>r.name.toLowerCase().includes(q)); }

  const receitas = filterByPeriodo(DB.tx.filter(t=>t.type==='receita'));
  const byOrig = {};
  receitas.forEach(t=>{
    const key = (t.description||'—').trim();
    if(!byOrig[key]) byOrig[key] = {count:0,total:0, category:t.category};
    byOrig[key].count++; byOrig[key].total += netReceita(t);
  });
  const totalReceitasGeral = receitas.reduce((s,t)=>s+netReceita(t),0);
  let origRows = Object.entries(byOrig).map(([name,v])=>({name,...v, pct: totalReceitasGeral?v.total/totalReceitasGeral*100:0}));
  origRows.sort((a,b)=>b.total-a.total);

  const parcelasRaw = DB.tx.filter(t=>t.installmentTotal && t.installmentCurrent && t.installmentCurrent < t.installmentTotal);
  // dedup: a mesma compra parcelada pode ter uma linha por fatura importada — mantem so a ocorrencia mais avancada (maior parcela atual).
  // a data original da compra entra na chave pra nao confundir duas compras diferentes com mesma loja/valor/cartao.
  const parcelasDedupMap = {};
  parcelasRaw.forEach(t=>{
    const key = normalizeMerchant(t.description)+'|'+t.installmentTotal+'|'+(t.cardId||'')+'|'+t.date;
    if(!parcelasDedupMap[key] || t.installmentCurrent > parcelasDedupMap[key].installmentCurrent) parcelasDedupMap[key] = t;
  });
  const parcelas = Object.values(parcelasDedupMap);
  const parcelasInfo = parcelas.map(t=>{
    const remaining = t.installmentTotal - t.installmentCurrent;
    // base do calculo: mes da fatura atual (nao a data original da compra, que pode ser bem anterior)
    const baseDate = t.invoiceMonth ? parseISO(t.invoiceMonth+'-01') : parseISO(t.date);
    const end = new Date(baseDate.getFullYear(), baseDate.getMonth()+remaining, 1);
    return {...t, remaining, endLabel: MONTHS_PT[end.getMonth()]+' de '+end.getFullYear()};
  }).sort((a,b)=>a.remaining-b.remaining);

  // heatmap: gastos por dia da semana, ultimos 90 dias
  const weekdayLabels = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const ninetyDaysAgo = new Date(); ninetyDaysAgo.setDate(ninetyDaysAgo.getDate()-90);
  const weekdayTotals = [0,0,0,0,0,0,0]; const weekdayCounts = [0,0,0,0,0,0,0];
  DB.tx.filter(t=>t.type==='despesa' && t.amount>0 && t.date && parseISO(t.date)>=ninetyDaysAgo).forEach(t=>{
    const wd = parseISO(t.date).getDay();
    weekdayTotals[wd]+=t.amount; weekdayCounts[wd]++;
  });
  const weekdayMax = Math.max(...weekdayTotals, 1);

  // projecao proximos 3 meses: media variavel dos ultimos 3 meses + parcelamentos ja conhecidos
  const projMonths = [1,2,3].map(i=> new Date(state.month.getFullYear(), state.month.getMonth()+i, 1));
  const histMonths = [1,2,3].map(i=> new Date(state.month.getFullYear(), state.month.getMonth()-i, 1));
  let sumVariable = 0;
  histMonths.forEach(hm=>{
    const hmk = hm.getFullYear()+'-'+String(hm.getMonth()+1).padStart(2,'0');
    const totalMes = DB.tx.filter(t=>t.type==='despesa'&&t.amount>0&&txMonthKey(t)===hmk).reduce((s,t)=>s+t.amount,0);
    const parceladoMes = DB.tx.filter(t=>t.type==='despesa'&&t.amount>0&&t.installmentTotal&&txMonthKey(t)===hmk).reduce((s,t)=>s+t.amount,0);
    sumVariable += (totalMes - parceladoMes);
  });
  const baseVariable = sumVariable/3;
  const projData = projMonths.map(pm=>{
    let comprometido = 0;
    parcelasInfo.forEach(t=>{
      const baseDate = t.invoiceMonth ? parseISO(t.invoiceMonth+'-01') : parseISO(t.date);
      const inicioResto = new Date(baseDate.getFullYear(), baseDate.getMonth()+1, 1);
      const fim = new Date(baseDate.getFullYear(), baseDate.getMonth()+t.remaining, 1);
      if(pm>=inicioResto && pm<=fim) comprometido += t.amount;
    });
    return {label:MONTHS_SHORT[pm.getMonth()]+'/'+String(pm.getFullYear()).slice(2), variavel:Math.max(0,baseVariable), comprometido, total: Math.max(0,baseVariable)+comprometido};
  });
  const projMax = Math.max(...projData.map(p=>p.total), baseVariable, 1);

  return `
    <div class="card card-pad" style="margin-bottom:16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
      <div class="tabs" style="margin-bottom:0;">
        <button class="tab ${(state.relatorioPeriodo||'tudo')==='mes'?'active':''}" onclick="state.relatorioPeriodo='mes'; renderPage();">Por Mês</button>
        <button class="tab ${(state.relatorioPeriodo||'tudo')==='ano'?'active':''}" onclick="state.relatorioPeriodo='ano'; renderPage();">Por Ano</button>
        <button class="tab ${(state.relatorioPeriodo||'tudo')==='tudo'?'active':''}" onclick="state.relatorioPeriodo='tudo'; renderPage();">Todos os Períodos</button>
      </div>
      ${(state.relatorioPeriodo)==='mes' ? monthNav() : ''}
      ${(state.relatorioPeriodo)==='ano' ? `<div class="month-switch">
        <button onclick="state.relatorioAno=(state.relatorioAno||new Date().getFullYear())-1; renderPage();">‹</button>
        <span class="lbl">${anoAtual}</span>
        <button onclick="state.relatorioAno=(state.relatorioAno||new Date().getFullYear())+1; renderPage();">›</button>
      </div>` : ''}
      <span style="font-size:11.5px; color:var(--text-faint);">controla os quadros de "Gastos por Estabelecimento" e "Receitas por Origem" abaixo</span>
    </div>

    <div class="section-title" style="margin-top:4px;">
      <h3 style="font-size:16px;">📅 Resumo Anual</h3>
      <div class="month-switch">
        <button onclick="state.relatorioAno=(state.relatorioAno||new Date().getFullYear())-1; renderPage();">‹</button>
        <span class="lbl">${anoAtual}</span>
        <button onclick="state.relatorioAno=(state.relatorioAno||new Date().getFullYear())+1; renderPage();">›</button>
      </div>
    </div>
    <div class="grid g4" style="margin-bottom:16px;">
      <div class="card stat-card"><div class="stat-top"><span class="ic" style="background:var(--primary-tint);color:var(--primary-dark)">↗</span>RECEITAS NO ANO</div><div class="stat-value up">${fmtBRL(totalReceitasAno)}</div></div>
      <div class="card stat-card"><div class="stat-top"><span class="ic" style="background:var(--danger-tint);color:var(--danger)">↘</span>DESPESAS NO ANO</div><div class="stat-value down">${fmtBRL(totalDespesasAno)}</div></div>
      <div class="card stat-card"><div class="stat-top"><span class="ic" style="background:var(--info-tint);color:var(--info)">◈</span>SALDO NO ANO</div><div class="stat-value">${fmtBRL(totalReceitasAno-totalDespesasAno)}</div></div>
      <div class="card stat-card"><div class="stat-top"><span class="ic" style="background:var(--warning-tint);color:#A6720F">◆</span>MÉDIA MENSAL DE GASTO</div><div class="stat-value">${fmtBRL(totalDespesasAno/12)}</div></div>
    </div>

    <div class="grid g2" style="margin-bottom:16px;">
      <div class="card card-pad">
        <div class="section-title"><h3>Evolução do Ano</h3><span class="meta">${anoAtual}, mês a mês</span></div>
        <div style="height:200px;" id="chartAnoEvo"></div>
      </div>
      <div class="card card-pad">
        <div class="section-title"><h3>Despesas por Categoria no Ano</h3><span class="meta">${anoCatRows.length} categorias</span></div>
        ${anoCatRows.length===0? emptyState('📅','Nenhuma despesa neste ano',' ') :
          anoCatRows.map(r=>{ const pct=totalDespesasAno?(r.val/totalDespesasAno*100):0;
            return `<div class="legend-row"><span class="legend-name">${r.c?r.c.icon+' '+esc(r.c.name):'—'}</span><span class="legend-pct">${pct.toFixed(1)}%</span><span class="legend-val">${fmtBRL(r.val)}</span></div>`; }).join('')}
      </div>
    </div>

    <div class="grid g2" style="margin-bottom:16px;">
      <div class="card card-pad">
        <div class="section-title"><h3>Gastos por Dia da Semana</h3><span class="meta">últimos 90 dias</span></div>
        <div style="display:flex; gap:6px; align-items:flex-end; height:130px; padding:0 4px;">
          ${weekdayLabels.map((lbl,i)=>{
            const val = weekdayTotals[i]; const intensity = val/weekdayMax;
            const h = Math.max(6, intensity*100);
            const bg = intensity===0 ? '#EEF0F2' : `rgba(14,169,114,${0.18+intensity*0.75})`;
            return `<div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end;">
              <div class="oc-hoverable" data-tip-label="${lbl}-feira" data-tip-pct="${weekdayCounts[i]} despesa(s)" data-tip-value="${esc(fmtBRL(val))}" style="width:100%; height:${h}px; border-radius:7px; background:${bg}; transition:height .2s;"></div>
              <div style="font-size:10.5px; color:var(--text-faint); font-weight:600;">${lbl}</div>
            </div>`;
          }).join('')}
        </div>
        <div style="font-size:11px; color:var(--text-faint); text-align:center; margin-top:10px;">quanto mais escuro, mais você gasta nesse dia da semana</div>
      </div>
      <div class="card card-pad">
        <div class="section-title"><h3>Projeção — Próximos 3 Meses</h3><span class="meta">estimativa</span></div>
        <div style="height:150px; display:flex; align-items:flex-end; gap:12px; padding:0 8px; position:relative; margin-left:44px;">
          <div style="position:absolute; left:-44px; top:0; bottom:0; width:40px;">
            ${[1,0.75,0.5,0.25,0].map(f=>`<div style="position:absolute; left:0; width:40px; text-align:right; padding-right:6px; bottom:${f*110}px; transform:translateY(50%); font-size:9px; color:var(--text-faint); white-space:nowrap;">${fmtBRL(projMax*f).replace('R$ ','')}</div>`).join('')}
          </div>
          ${[0,0.25,0.5,0.75,1].map(f=>`<div style="position:absolute; left:0; right:0; bottom:${f*110}px; border-top:1px dashed var(--surface-2);"></div>`).join('')}
          ${projData.map(p=>{
            const hVar = (p.variavel/projMax*110); const hComp = (p.comprometido/projMax*110);
            return `<div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; z-index:1;">
              <div class="oc-hoverable" data-tip-label="${p.label} (projeção)" data-tip-pct="variável ${esc(fmtBRL(p.variavel))} + parcelas ${esc(fmtBRL(p.comprometido))}" data-tip-value="${esc(fmtBRL(p.total))}" style="width:34px; display:flex; flex-direction:column-reverse; border:1.5px dashed var(--text-faint); border-radius:6px; overflow:hidden;">
                <div style="height:${hVar}px; background:repeating-linear-gradient(135deg, var(--primary-tint), var(--primary-tint) 4px, var(--surface-2) 4px, var(--surface-2) 8px);"></div>
                <div style="height:${hComp}px; background:repeating-linear-gradient(135deg, var(--info-tint), var(--info-tint) 4px, var(--surface-2) 4px, var(--surface-2) 8px);"></div>
              </div>
              <div style="font-size:10.5px; color:var(--text-faint); font-weight:600;">${p.label}</div>
              <div style="font-family:var(--mono); font-size:10.5px; font-weight:700;">${fmtBRL(p.total)}</div>
            </div>`;
          }).join('')}
        </div>
        <div style="display:flex; gap:14px; justify-content:center; margin-top:14px; font-size:10.5px; color:var(--text-muted);">
          <span><span style="display:inline-block;width:9px;height:9px;background:var(--primary-tint);border-radius:2px;margin-right:5px;"></span>variável (média)</span>
          <span><span style="display:inline-block;width:9px;height:9px;background:var(--info-tint);border-radius:2px;margin-right:5px;"></span>parcelas já sabidas</span>
        </div>
        <div style="font-size:10.5px; color:var(--text-faint); text-align:center; margin-top:6px;">baseado na média dos últimos 3 meses + parcelamentos em andamento — não considera gastos novos ainda não lançados</div>
      </div>
    </div>

    <div class="card card-pad" style="margin-bottom:16px;">
      <div class="section-title"><h3>Comparativo Mensal por Categoria</h3><span class="meta">últimos 6 meses, todas as categorias</span></div>
      ${cmpRows.length===0? emptyState('📊','Sem dados suficientes ainda',' ') : `
      <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
        <thead><tr style="color:var(--text-faint); font-size:10.5px; text-transform:uppercase;">
          <th style="text-align:left; padding:6px 8px; border-bottom:1px solid var(--border);">Categoria</th>
          ${cmpMonths.map(cm=>`<th style="text-align:right; padding:6px 8px; border-bottom:1px solid var(--border);">${MONTHS_SHORT[cm.getMonth()]}/${String(cm.getFullYear()).slice(2)}</th>`).join('')}
          <th style="text-align:right; padding:6px 8px; border-bottom:1px solid var(--border);">Total</th>
        </tr></thead>
        <tbody>
        ${cmpRows.map(r=>`<tr>
          <td style="padding:7px 8px; border-bottom:1px solid var(--surface-2); font-weight:600;">${r.c?r.c.icon+' '+esc(r.c.name):'—'}</td>
          ${r.vals.map(v=>`<td style="padding:7px 8px; border-bottom:1px solid var(--surface-2); text-align:right; font-family:var(--mono);">${v>0?fmtBRL(v):'—'}</td>`).join('')}
          <td style="padding:7px 8px; border-bottom:1px solid var(--surface-2); text-align:right; font-family:var(--mono); font-weight:700;">${fmtBRL(r.total)}</td>
        </tr>`).join('')}
        <tr>
          <td style="padding:8px; font-weight:800;">Total do mês</td>
          ${cmpTotals.map(v=>`<td style="padding:8px; text-align:right; font-family:var(--mono); font-weight:800;">${fmtBRL(v)}</td>`).join('')}
          <td style="padding:8px; text-align:right; font-family:var(--mono); font-weight:800;">${fmtBRL(cmpTotals.reduce((s,v)=>s+v,0))}</td>
        </tr>
        </tbody>
      </table>`}
    </div>

    <div class="card card-pad" style="margin-bottom:16px;">
      <div class="section-title"><h3>Árvore do Orçamento</h3><span class="meta">${(state.relatorioPeriodo)==='mes'?monthLabel(state.month):(state.relatorioPeriodo)==='ano'?'ano de '+anoAtual:'todos os períodos'} · clique numa categoria pra ver o detalhe</span></div>
      ${(()=>{
        const despesasTree = filterByPeriodo(DB.tx.filter(t=>t.type==='despesa'));
        const receitasTree = filterByPeriodo(DB.tx.filter(t=>t.type==='receita'));
        const rootValue = receitasTree.reduce((s,t)=>s+netReceita(t),0);
        const totalDespesasTree = despesasTree.reduce((s,t)=>s+t.amount,0);
        const saldoTree = rootValue - totalDespesasTree;

        const byCatTree = {};
        despesasTree.filter(t=>t.amount>0).forEach(t=>{ byCatTree[t.category] = (byCatTree[t.category]||0)+t.amount; });
        let catRows = Object.entries(byCatTree).map(([cid,val])=>({id:cid, c:catById(cid), val})).sort((a,b)=>b.val-a.val);

        const drilled = state.treeDrill;
        const maxBar = rootValue>0 ? rootValue : Math.max(totalDespesasTree,1);

        const treeBar = (label, icon, val, colorClass, onclick, isRoot)=>{
          const pct = maxBar>0 ? Math.min(100, Math.max(0,(val/maxBar*100))) : 0;
          return `<div class="tree-row ${onclick?'oc-hoverable':''}" ${onclick?`onclick="${onclick}"`:''} data-tip-label="${esc(label)}" data-tip-pct="${(val/maxBar*100).toFixed(1)}% da receita líquida" data-tip-value="${esc(fmtBRL(val))}">
            <div class="tree-track"><div class="tree-fill ${colorClass}" style="width:${pct}%;"></div>
              <div class="tree-label">${icon?icon+' ':''}${isRoot?'<b>':''}${esc(label)}${isRoot?'</b>':''}</div>
            </div>
            <div class="tree-val">${fmtBRL(val)}</div>
          </div>`;
        };

        let bodyHtml = '';
        if(!drilled){
          bodyHtml = `
            ${treeBar('Receita Líquida', '💰', rootValue, 'tree-fill-root', null, true)}
            <div style="height:10px;"></div>
            ${catRows.map(r=> treeBar(r.c?r.c.name:'Outros', r.c?r.c.icon:'📦', r.val, 'tree-fill-cat', `state.treeDrill='${r.id}'; renderPage();`)).join('')}
            ${saldoTree>0 ? treeBar('Saldo (não gasto)', '✅', saldoTree, 'tree-fill-saldo', null) : ''}
          `;
        } else {
          const cat = catById(drilled);
          const catTotal = byCatTree[drilled]||0;
          const byEstTree = {};
          despesasTree.filter(t=>t.amount>0 && t.category===drilled).forEach(t=>{ byEstTree[t.description] = (byEstTree[t.description]||0)+t.amount; });
          const estRowsTree = Object.entries(byEstTree).sort((a,b)=>b[1]-a[1]);
          const maxBarDrill = catTotal>0?catTotal:1;
          bodyHtml = `
            <div style="margin-bottom:10px;"><button class="btn btn-sm btn-outline" onclick="state.treeDrill=null; renderPage();">← Voltar pra Receita Líquida</button></div>
            ${treeBar((cat?cat.name:'Outros'), cat?cat.icon:'📦', catTotal, 'tree-fill-root', null, true)}
            <div style="height:10px;"></div>
            ${estRowsTree.map(([name,val])=>{ const pct = maxBarDrill>0?Math.min(100,val/maxBarDrill*100):0;
              return `<div class="tree-row oc-hoverable" data-tip-label="${esc(name)}" data-tip-pct="${(val/maxBarDrill*100).toFixed(1)}% da categoria" data-tip-value="${esc(fmtBRL(val))}">
                <div class="tree-track"><div class="tree-fill tree-fill-cat" style="width:${pct}%;"></div><div class="tree-label">${esc(name)}</div></div>
                <div class="tree-val">${fmtBRL(val)}</div>
              </div>`; }).join('')}
          `;
        }
        return bodyHtml || emptyState('🌳','Sem dados neste período',' ');
      })()}
    </div>

    <div class="card card-pad" style="margin-bottom:16px;">
      <div class="section-title"><h3>Gastos por Estabelecimento / Descrição</h3><span class="meta">${(state.relatorioPeriodo)==='mes'?monthLabel(state.month):(state.relatorioPeriodo)==='ano'?'ano de '+anoAtual:'todos os períodos'}</span></div>
      ${estRows.length===0? emptyState('🏪','Nenhuma despesa registrada ainda','Lance despesas ou importe faturas para ver o ranking por estabelecimento.') : `
      <table style="width:100%; border-collapse:collapse;">
        <thead><tr style="text-align:left; font-size:11px; color:var(--text-faint); text-transform:uppercase;">
          <th style="padding:6px 8px; border-bottom:1px solid var(--border)">Estabelecimento</th>
          <th style="padding:6px 8px; border-bottom:1px solid var(--border)">Categoria</th>
          <th style="padding:6px 8px; border-bottom:1px solid var(--border); text-align:center;">Compras</th>
          <th style="padding:6px 8px; border-bottom:1px solid var(--border); text-align:right;">Total</th>
          <th style="padding:6px 8px; border-bottom:1px solid var(--border); text-align:right;">% do orçamento</th>
        </tr></thead>
        <tbody>
        ${estRows.map(r=>{ const c=catById(r.category); return `<tr>
          <td style="padding:9px 8px; border-bottom:1px solid var(--surface-2); font-weight:600;">${esc(r.name)}</td>
          <td style="padding:9px 8px; border-bottom:1px solid var(--surface-2); color:var(--text-muted);">${c?c.icon+' '+esc(c.name):'—'}</td>
          <td style="padding:9px 8px; border-bottom:1px solid var(--surface-2); text-align:center; font-family:var(--mono);">${r.count}</td>
          <td style="padding:9px 8px; border-bottom:1px solid var(--surface-2); text-align:right; font-family:var(--mono); font-weight:600;">${fmtBRL(r.total)}</td>
          <td style="padding:9px 8px; border-bottom:1px solid var(--surface-2); text-align:right; font-family:var(--mono);">${r.pct.toFixed(1)}%</td>
        </tr>`; }).join('')}
        </tbody>
      </table>`}
    </div>

    <div class="card card-pad" style="margin-bottom:16px;">
      <div class="section-title"><h3>Receitas por Origem</h3><span class="meta">${(state.relatorioPeriodo)==='mes'?monthLabel(state.month):(state.relatorioPeriodo)==='ano'?'ano de '+anoAtual:'todos os períodos'}</span></div>
      ${origRows.length===0? emptyState('💰','Nenhuma receita registrada ainda','Lance receitas para ver de onde vem mais dinheiro — ex: qual paciente ou cliente rende mais.') : `
      <table style="width:100%; border-collapse:collapse;">
        <thead><tr style="text-align:left; font-size:11px; color:var(--text-faint); text-transform:uppercase;">
          <th style="padding:6px 8px; border-bottom:1px solid var(--border)">Origem</th>
          <th style="padding:6px 8px; border-bottom:1px solid var(--border)">Categoria</th>
          <th style="padding:6px 8px; border-bottom:1px solid var(--border); text-align:center;">Recebimentos</th>
          <th style="padding:6px 8px; border-bottom:1px solid var(--border); text-align:right;">Total</th>
          <th style="padding:6px 8px; border-bottom:1px solid var(--border); text-align:right;">% da receita</th>
        </tr></thead>
        <tbody>
        ${origRows.map(r=>{ const c=catById(r.category); return `<tr>
          <td style="padding:9px 8px; border-bottom:1px solid var(--surface-2); font-weight:600;">${esc(r.name)}</td>
          <td style="padding:9px 8px; border-bottom:1px solid var(--surface-2); color:var(--text-muted);">${c?c.icon+' '+esc(c.name):'—'}</td>
          <td style="padding:9px 8px; border-bottom:1px solid var(--surface-2); text-align:center; font-family:var(--mono);">${r.count}</td>
          <td style="padding:9px 8px; border-bottom:1px solid var(--surface-2); text-align:right; font-family:var(--mono); font-weight:600;">${fmtBRL(r.total)}</td>
          <td style="padding:9px 8px; border-bottom:1px solid var(--surface-2); text-align:right; font-family:var(--mono);">${r.pct.toFixed(1)}%</td>
        </tr>`; }).join('')}
        </tbody>
      </table>`}
    </div>

    <div class="card card-pad">
      <div class="section-title"><h3>Parcelamentos em Andamento</h3><span class="meta">${parcelasInfo.length} ativo(s)</span></div>
      ${parcelasInfo.length===0? emptyState('📆','Nenhum parcelamento em aberto','Lance despesas parceladas para acompanhar aqui quando elas terminam.') :
        parcelasInfo.map(t=>{ const c=catById(t.category); const card=t.cardId?cardById(t.cardId):null; const pct=(t.installmentCurrent/t.installmentTotal*100);
          return `<div class="tx-row" style="flex-wrap:wrap;">
          <div class="tx-ic out">${c?c.icon:'🧾'}</div>

/* ============================ CHARTS (SVG puro, sem dependências externas) ============================ */
function svgDonut(segments, size, thickness){
  size = size||150; thickness = thickness||16;
  const total = segments.reduce((s,x)=>s+x.value,0);
  const r = (size-thickness)/2, cx=size/2, cy=size/2, circ=2*Math.PI*r;
  if(total<=0){ return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#EEF0F2" stroke-width="${thickness}"/></svg>`; }
  let offset=0;
  const arcs = segments.map(seg=>{
    const frac = seg.value/total;
    const dash = Math.max(frac*circ - (segments.length>1?1.5:0),0);
    const pctLabel = (frac*100).toFixed(1)+'%';
    const tipAttrs = seg.label!=null ? `class="oc-hoverable" data-tip-label="${esc(seg.label)}" data-tip-pct="${esc(pctLabel)}" data-tip-value="${esc(fmtBRL(seg.value))}"` : '';
    const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${thickness}" stroke-linecap="round" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})" ${tipAttrs}/>`;
    offset += frac*circ;
    return el;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${arcs}</svg>`;
}
function renderDonutInto(elId, entries, colorFn, totalOverride, labelFn){
  const el = document.getElementById(elId);
  if(!el) return;
  if(!entries || entries.length===0){ el.innerHTML=''; return; }
  const segments = entries.map((e,i)=>({value:e[1], color:colorFn(e[0],i), label: labelFn?labelFn(e[0],i):null}));
  const total = (typeof totalOverride === 'number') ? totalOverride : segments.reduce((s,x)=>s+x.value,0);
  el.innerHTML = svgDonut(segments,150,17) +
    `<div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none;">
       <div style="font-size:9px; color:var(--text-faint); font-weight:700; letter-spacing:.05em;">TOTAL</div>
       <div style="font-family:var(--mono); font-size:13px; font-weight:600; text-align:center; padding:0 8px;">${fmtBRL(total)}</div>
     </div>`;
}
function renderEvoBars(elId, data){
  const el = document.getElementById(elId);
  if(!el) return;
  const w=680,h=190, padL=40, padB=26, padT=10;
  const max = Math.max(1, ...data.map(d=>Math.max(d.r,d.de)));
  const plotW = w-padL-10, plotH = h-padB-padT;
  const groupW = plotW/data.length;
  const barW = Math.min(22, groupW*0.32);
  let bars='', labels='', gridlines='';
  const steps=4;
  for(let s=0;s<=steps;s++){
    const val = max/steps*s;
    const y = padT+plotH-(val/max*plotH);
    gridlines += `<line x1="${padL}" y1="${y}" x2="${w-10}" y2="${y}" stroke="#F0F1F3" stroke-width="1"/><text x="${padL-6}" y="${y+3}" font-size="9" fill="#9CA3AF" text-anchor="end">${(val/1000).toFixed(0)}k</text>`;
  }
  data.forEach((d,i)=>{
    const gx = padL + i*groupW + groupW/2;
    const rh = d.r/max*plotH, dh = d.de/max*plotH;
    bars += `<rect class="oc-hoverable" data-tip-label="Receitas — ${esc(d.label)}" data-tip-value="${esc(fmtBRL(d.r))}" x="${gx-barW-2}" y="${padT+plotH-rh}" width="${barW}" height="${Math.max(rh,2)}" rx="4" fill="#0EA972"/>`;
    bars += `<rect class="oc-hoverable" data-tip-label="Despesas — ${esc(d.label)}" data-tip-value="${esc(fmtBRL(d.de))}" x="${gx+2}" y="${padT+plotH-dh}" width="${barW}" height="${Math.max(dh,2)}" rx="4" fill="#E4483A"/>`;
    labels += `<text x="${gx}" y="${h-8}" font-size="11" fill="#6B7280" text-anchor="middle">${d.label}</text>`;
  });
  el.innerHTML = `<svg width="100%" height="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${gridlines}${bars}${labels}</svg>
    <div style="display:flex; justify-content:center; gap:18px; margin-top:4px;">
      <span style="font-size:11px;color:var(--text-muted);"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#0EA972;margin-right:5px;"></span>Receitas</span>
      <span style="font-size:11px;color:var(--text-muted);"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#E4483A;margin-right:5px;"></span>Despesas</span>
    </div>`;
}

function computeAtendimento(qtd, rate, irPct, repassePct, repasseFlat){
  const gross = qtd * rate;
  const posIr = gross * (1 - (Number(irPct)||0)/100);
  let repasse;
  if(repassePct!=null && repassePct!==''){ repasse = posIr * (Number(repassePct)/100); }
  else { repasse = Number(repasseFlat)||0; }
  const liquido = posIr - repasse;
  return {gross, posIr, repasse, liquido, rate};
}
function readAtendimentoForm(){
  const qtd = parseInt(document.getElementById('f_atQtd').value)||0;
  const rate = parseFloat(document.getElementById('f_atRate').value)||0;
  const irPct = document.getElementById('f_atIr').value;
  const repassePctEl = document.getElementById('f_atRepassePct');
  const repasseFlatEl = document.getElementById('f_atRepasse');
  const repassePct = (repassePctEl && repassePctEl.value!=='') ? repassePctEl.value : null;
  return computeAtendimento(qtd, rate, irPct, repassePct, repasseFlatEl?repasseFlatEl.value:0);
}

        <div class="field"><label>Data</label><input class="input full" id="f_mDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
        <div class="net-preview" id="multiploPreview"></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="confirmMultiplo('${id}')">Lançar</button>
      </div>
    </div>
  `);
  updateMultiploPreview(id);
}
function computeMultiplo(tpl){
  let gross = 0; const parts = [];
  tpl.services.forEach((s,i)=>{
    const qtd = parseInt(document.getElementById('f_mqtd_'+i)?.value)||0;
    if(qtd>0){ const sub = qtd*Number(s.rate); gross += sub; parts.push(qtd+'x '+s.name); }
  });
  const posIr = gross * (1 - (Number(tpl.irPercent)||0)/100);
  const repasse = posIr * (Number(tpl.repassePercent)||0)/100;
  const liquido = posIr - repasse;
  return {gross, repasse, liquido, parts};
}
function updateMultiploPreview(id){
  const tpl = DB.templates.find(x=>x.id===id);
  const r = computeMultiplo(tpl);
  const el = document.getElementById('multiploPreview');
  if(el) el.innerHTML = `${r.parts.join(' + ')||'—'} = <b>${fmtBRL(r.gross)}</b><br>IR ${tpl.irPercent}% − repasse ${tpl.repassePercent}% do pós-IR → líquido: <b>${fmtBRL(r.liquido)}</b>`;
}
function confirmMultiplo(id){
  const tpl = DB.templates.find(x=>x.id===id);
  const r = computeMultiplo(tpl);
  if(r.gross<=0){ toast('Informe ao menos uma quantidade','danger'); return; }
  const nome = (document.getElementById('f_mName').value||tpl.title).trim();
  const obj = {
    id: uid(), type:'receita', description: nome+' ('+r.parts.join(', ')+')', category: tpl.category,
    amount: r.gross, date: document.getElementById('f_mDate').value, status:'pendente',

}

function computePartnerRepasses(){
  const rows = state.editingPartnerRows || [];
  const options = getParceiraTemplates();
  return rows.filter(r=>r.partnerId).map(r=>{
    const tpl = options.find(o=>o.id===r.partnerId);

    return {partnerId:r.partnerId, partnerName: tpl?tpl.title:'', qty:r.qty, rate, total: rate*r.qty};
  });

function updateNetPreview(){

  if(wrap) wrap.innerHTML = renderParceiraRows();
  const rep = wrap ? computePartnerRepasses().reduce((s,r)=>s+r.total,0) : 0;
  const net = Math.max(0, amt*(1-tax/100)-rep);
  const el = document.getElementById('netPreview'); if(el) el.innerHTML = 'Valor líquido: <b>'+fmtBRL(net)+'</b>'+(rep>0?' <span style="color:var(--text-faint); font-weight:400;">(já descontando '+fmtBRL(rep)+' de repasse)</span>':'');
}
function saveTx(keepOpen){
  const desc = document.getElementById('f_desc').value.trim();
  const amount = parseFloat(document.getElementById('f_amount').value);
  if(!desc){ toast('Informe uma descrição','danger'); return; }
  if(!amount || amount<=0){ toast('Informe um valor válido','danger'); return; }
  const t = state.editing;
  const pm = document.getElementById('f_pm').value;
  const obj = {
    id: t.id || uid(), type:t.type, description:desc,
    category: document.getElementById('f_cat').value,
    amount, date: document.getElementById('f_date').value,
    status: document.getElementById('f_status').value,
    paymentMethod: pm,
    cardId: pm==='cartao' ? document.getElementById('f_card').value : '',
    installmentCurrent: pm==='cartao' ? (parseInt(document.getElementById('f_installCur').value)||'') : '',
    installmentTotal: pm==='cartao' ? (parseInt(document.getElementById('f_installTot').value)||'') : '',
    invoiceMonth: pm==='cartao' ? (document.getElementById('f_invoiceMonth').value || '') : '',
    recurring: document.getElementById('f_recurring').checked, createdAt: t.createdAt || new Date().toISOString(),
    paidAt: (document.getElementById('f_status').value==='pago') ? (t.status==='pago' ? (t.paidAt||new Date().toISOString()) : new Date().toISOString()) : '',
    dueDate: document.getElementById('f_due').value || '',
    notes: document.getElementById('f_notes').value,
  };
  if(t.type==='receita'){
    obj.taxPercent = parseFloat(document.getElementById('f_tax').value)||0;
    const partnerRepasses = (obj.category==='c-paciente') ? computePartnerRepasses() : [];
    obj.partnerRepasses = partnerRepasses;
    obj.repasseAmount = partnerRepasses.reduce((s,r)=>s+r.total,0);
  }
  const idx = DB.tx.findIndex(x=>x.id===obj.id);
  const wasEditingExisting = !!t.id;
  const categoryChanged = wasEditingExisting && t.category !== obj.category;
  if(idx>=0) DB.tx[idx] = obj; else DB.tx.push(obj);
  if(obj.type==='despesa' && categoryChanged){ learnMerchantRule(obj.description, obj.category, 'despesa'); }
  if(obj.type==='despesa'){
    try{ localStorage.setItem('orcame:lastPm', obj.paymentMethod); if(obj.cardId) localStorage.setItem('orcame:lastCard', obj.cardId); }catch(_){}
  }
  persist('tx').then(()=>{
    toast('Transação salva');
    if(keepOpen && !wasEditingExisting){
      openTxModal(null, obj.type); // limpa o formulario mantendo tipo/cartao/forma de pagamento para o proximo lancamento
      renderPage();
    } else {
      closeModal(); renderPage();
    }
  });
}

    DB.tx = DB.tx.filter(t=>t.id!==id);

  });
}

        ` : `

function goalPreviewText(g, proj){
  if(!proj) return 'Preencha os valores para ver a projeção.';
  if(proj.reached) return '🎉 Esse objetivo já está alcançado com o valor atual.';
  if(g.mode==='porAporte'){
    if(proj.months===Infinity) return 'Com esse aporte, o objetivo nunca é alcançado.';
    return `Tempo estimado: <b>${proj.months} meses</b>`;
  }
  if(proj.requiredPMT===null) return 'Informe um prazo válido.';
  if(proj.requiredPMT<=0) return 'Já alcança a meta nesse prazo sem aporte adicional.';
  return `Aporte mensal necessário: <b>${fmtBRL(proj.requiredPMT)}</b>`;
}
function updateGoalPreview(){
  const g = state.editing;

  g.targetValue = document.getElementById('f_gtarget').value;
  if(g.type==='juros'){ const r=document.getElementById('f_grate'); if(r) g.monthlyRate = r.value; }
  if(g.mode==='porAporte'){ const p=document.getElementById('f_gpmt'); if(p) g.monthlyContribution = p.value; }
  else { const m=document.getElementById('f_gmonths'); if(m) g.targetMonths = m.value; }
  const proj = (g.currentValue!==''&&g.targetValue!=='') ? computeGoalProjection(g) : null;
  const el = document.getElementById('goalPreview');
  if(el) el.innerHTML = goalPreviewText(g, proj);
}

const MERCHANT_HINTS = [
  {re:/mercado\s*livre|mercadolivre/i, cat:'c-marketplace'},
  {re:/ifood|rappi|uber\s*eats/i, cat:'c-alimentacao'},
  {re:/uber(?!\s*eats)|99app|99pop|taxi|zul\s*digital|metro(?!\s*livre)/i, cat:'c-transporte'},
  {re:/farma|drogaria|drogasil|panvel/i, cat:'c-saude'},
  {re:/netflix|spotify|hbo|disney|amazon\s*prime|youtube/i, cat:'c-lazer'},
  {re:/posto|shell|ipiranga|combust/i, cat:'c-transporte'},
  {re:/mercado(?!\s*livre)|supermercado|carrefour|paodeacucar|assai/i, cat:'c-alimentacao'},
  {re:/academia|smart\s*fit/i, cat:'c-saude'},
  {re:/amazon|shopee|shein|aliexpress|magazine\s*luiza|magalu|temu/i, cat:'c-marketplace'},
  {re:/contabilizei|grana\s*capital|kaspersky|tecmilhas\s*solucoes/i, cat:'c-servicos'},
  {re:/distribuidora\s*j\s*n|havan/i, cat:'c-vestuario'},
];
function normalizeMerchant(desc){
  return (desc||'').toLowerCase().trim().replace(/\s{2,}/g,' ');
}
function guessCategory(desc){
  const norm = normalizeMerchant(desc);
  const learned = DB.merchantRules.find(r=>r.type==='despesa' && norm.includes(normalizeMerchant(r.pattern)));
  if(learned) return learned.category;
  const hit = MERCHANT_HINTS.find(h=>h.re.test(desc));
  return hit ? hit.cat : 'c-outros-d';
}
function learnMerchantRule(description, category, type){
  const pattern = normalizeMerchant(description);
  if(!pattern || pattern.length<2) return;
  const existing = DB.merchantRules.find(r=>r.type===type && normalizeMerchant(r.pattern)===pattern);
  if(existing){
    if(existing.category===category) return; // ja aprendido, nada a fazer
    existing.category = category;
  } else {
    DB.merchantRules.push({id:uid(), pattern:description.trim(), category, type});
  }
  persist('merchantRules');
}

function openDuplicateMonthModal(){
  const src = new Date(state.month);
  const tgt = new Date(src.getFullYear(), src.getMonth()+1, 1);
  const srcMk = src.getFullYear()+'-'+String(src.getMonth()+1).padStart(2,'0');
  const count = DB.tx.filter(t=>t.type==='despesa' && t.paymentMethod!=='cartao' && txMonthKey(t)===srcMk).length;
  openModal(`
    <div class="modal" style="max-width:420px;">
      <div class="modal-head"><h3>Duplicar despesas de um mês</h3><button class="close-x" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <div class="hint-box">Copia as despesas em pix/dinheiro/transferência do mês de origem para o mês de destino, como novos lançamentos pendentes — <b>não inclui despesas de cartão de crédito</b> (essas você importa direto da fatura). O mês de origem não é alterado.</div>
        <div class="field"><label>Mês de origem</label><input class="input full" id="f_dupSrc" type="month" value="${srcMk}" onchange="updateDupCount()"></div>
        <div class="field"><label>Mês de destino</label><input class="input full" id="f_dupTgt" type="month" value="${tgt.getFullYear()}-${String(tgt.getMonth()+1).padStart(2,'0')}"></div>
        <div id="dupCountInfo" style="font-size:12.5px; color:var(--text-muted);">${count} despesa(s) serão copiadas.</div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="confirmDuplicateMonth()">Duplicar</button>
      </div>
    </div>
  `);
}
function updateDupCount(){
  const srcMk = document.getElementById('f_dupSrc').value;
  const count = DB.tx.filter(t=>t.type==='despesa' && t.paymentMethod!=='cartao' && txMonthKey(t)===srcMk).length;
  document.getElementById('dupCountInfo').textContent = count+' despesa(s) serão copiadas.';
}
function confirmDuplicateMonth(){
  const srcMk = document.getElementById('f_dupSrc').value;
  const tgtMk = document.getElementById('f_dupTgt').value;
  if(!srcMk || !tgtMk){ toast('Selecione os dois meses','danger'); return; }
  if(srcMk===tgtMk){ toast('Escolha meses diferentes','danger'); return; }
  const [tgtY, tgtM] = tgtMk.split('-').map(Number);
  const sourceRows = DB.tx.filter(t=>t.type==='despesa' && t.paymentMethod!=='cartao' && txMonthKey(t)===srcMk);
  if(sourceRows.length===0){ toast('Nenhuma despesa encontrada no mês de origem','danger'); return; }
  confirmAction(`Duplicar ${sourceRows.length} despesa(s) de ${srcMk} para ${tgtMk} como novos lançamentos pendentes?`, ()=>{
    const now = new Date().toISOString();
    sourceRows.forEach((t,i)=>{
      const origDate = parseISO(t.date);
      const day = Math.min(origDate.getDate(), new Date(tgtY, tgtM, 0).getDate()); // ajusta se o dia nao existir no mes destino
      const newDate = tgtY+'-'+String(tgtM).padStart(2,'0')+'-'+String(day).padStart(2,'0');
      DB.tx.push({
        id: uid(), type:'despesa', description:t.description, category:t.category, amount:t.amount,
        date:newDate, status:'pendente', paymentMethod:t.paymentMethod, cardId:t.cardId||'',
        installmentCurrent:t.installmentCurrent||'', installmentTotal:t.installmentTotal||'',
        invoiceMonth: t.paymentMethod==='cartao' ? tgtMk : '',
        recurring: !!t.recurring, dueDate:'', notes:t.notes||'',
        createdAt: new Date(new Date(now).getTime()+i).toISOString(),
      });
    });
    persist('tx').then(()=>{ closeModal(); toast(sourceRows.length+' despesa(s) duplicadas para '+tgtMk); state.month=new Date(tgtY,tgtM-1,1); renderPage(); });
  }, {label:'Duplicar', danger:false});
}
function openImportModal(){
  state.importStep = 0; state.importRows = []; state.importRawText = '';
  const contextCard = (state.txFilterCard && state.txFilterCard!=='todos') ? state.txFilterCard : null;
  state.importCardId = contextCard || DB.cards[0]?.id || null;
  state.importTab = 'texto';
  state.importInvoiceMonth = state.month.getFullYear()+'-'+String(state.month.getMonth()+1).padStart(2,'0');
  state.importStatus = 'pendente';
  renderImportModal();
}
function switchImportTab(tab){ state.importTab = tab; renderImportModal(); }
function renderImportModal(){
  const step = state.importStep;
  let body = '';
  if(step===0){
    const tab = state.importTab||'texto';
    body = `
      <div class="row2">
        <div class="field"><label>Cartão de destino</label><select class="select full" id="f_importCard" onchange="state.importCardId=this.value;">
          ${DB.cards.length===0?'<option value="">Cadastre um cartão primeiro</option>':DB.cards.map(c=>`<option value="${c.id}" ${state.importCardId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
        </select></div>
        <div class="field"><label>Mês desta fatura</label><input class="input full" id="f_importMonth" type="month" value="${state.importInvoiceMonth}" onchange="state.importInvoiceMonth=this.value;"></div>
      </div>
      <div class="field"><label>Status dessas transações</label><div class="seg">
        <button class="${state.importStatus==='pendente'?'on':''}" onclick="state.importStatus='pendente'; renderImportModal();">Pendente</button>
        <button class="${state.importStatus==='pago'?'on':''}" onclick="state.importStatus='pago'; renderImportModal();">Já paga (fatura fechada/quitada)</button>
      </div></div>
      <div class="tabs">
        <button class="tab ${tab==='texto'?'active':''}" onclick="switchImportTab('texto')">📋 Colar texto</button>
        <button class="tab ${tab==='pdf'?'active':''}" onclick="switchImportTab('pdf')">📄 Enviar PDF</button>
      </div>
      ${tab==='texto' ? `
      <div class="hint-box">Cole aqui o texto da fatura — copiado do seu PDF/app do banco, ou enviado pelo Claude depois de você mandar prints da fatura no chat. Cada compra deve ter uma data e um valor na mesma linha (o formato comum de extrato já funciona).</div>
      <textarea class="input full" id="pasteTextArea" rows="10" placeholder="Ex: 18/06  MERCADO LIVRE  03/10          145,90&#10;19/06  IFOOD                             62,30"></textarea>
      <button class="btn btn-primary" style="margin-top:12px;" onclick="handlePastedText()">Analisar texto</button>
      ` : `
      <div class="hint-box">A leitura direta de PDF depende de bibliotecas externas que podem ser bloqueadas neste ambiente. Se não funcionar, use a aba "Colar texto" — é mais confiável.</div>
      <div class="dropzone" onclick="document.getElementById('pdfFileInput').click()">
        <div class="ic">📄</div>
        <div><b>Clique para escolher o PDF da fatura</b></div>
        <div style="font-size:11.5px; margin-top:4px;">ou arraste o arquivo aqui</div>
      </div>
      <input type="file" id="pdfFileInput" accept="application/pdf" style="display:none" onchange="handlePdfFile(event)">
      <div id="pdfLoadStatus" style="margin-top:10px; font-size:12.5px; color:var(--text-muted);"></div>
      `}
    `;
  } else if(step===1){
    const rows = state.importRows;
    const included = rows.filter(r=>r.include);
    body = `
      <div class="stat-mini">
        <div><b>${rows.length}</b><span>linhas detectadas</span></div>
        <div><b>${included.length}</b><span>selecionadas p/ importar</span></div>
        <div><b>${fmtBRL(included.reduce((s,r)=>s+(parseFloat(r.amount)||0),0))}</b><span>total selecionado</span></div>
      </div>
      ${rows.length===0? `<div class="hint-box">Não consegui reconhecer linhas de compra automaticamente neste PDF. Você pode ver o texto extraído abaixo e adicionar linhas manualmente, ou fechar e lançar as despesas uma a uma.</div>
        <button class="btn btn-outline btn-sm" onclick="addImportRow()">+ Adicionar linha manualmente</button>` : `
      <table class="import-table">
        <thead><tr><th></th><th>Data</th><th>Descrição</th><th>Categoria</th><th>Parc. atual</th><th>Parc. total</th><th>Valor (R$)</th></tr></thead>
        <tbody>
        ${rows.map((r,i)=>`<tr>
          <td><input type="checkbox" ${r.include?'checked':''} onchange="updateImportRow(${i},'include',this.checked)"></td>
          <td><input type="date" value="${r.date}" onchange="updateImportRow(${i},'date',this.value)"></td>
          <td><input type="text" value="${esc(r.description)}" onchange="updateImportRow(${i},'description',this.value)"></td>
          <td><select onchange="updateImportRow(${i},'category',this.value)">${catsFor('despesa').map(c=>`<option value="${c.id}" ${r.category===c.id?'selected':''}>${c.icon} ${esc(c.name)}</option>`).join('')}</select></td>
          <td><input type="number" min="1" style="width:52px" value="${r.installmentCurrent||''}" onchange="updateImportRow(${i},'installmentCurrent',this.value)"></td>
          <td><input type="number" min="1" style="width:52px" value="${r.installmentTotal||''}" onchange="updateImportRow(${i},'installmentTotal',this.value)"></td>
          <td><input type="number" step="0.01" style="width:80px" value="${r.amount}" onchange="updateImportRow(${i},'amount',this.value)"></td>
        </tr>`).join('')}
        </tbody>
      </table>
      <button class="btn btn-outline btn-sm" style="margin-top:10px;" onclick="addImportRow()">+ Adicionar linha</button>
      `}
      <details style="margin-top:14px;"><summary style="cursor:pointer; font-size:12px; color:var(--text-muted);">Ver texto extraído do PDF (conferência)</summary>
        <pre style="white-space:pre-wrap; font-size:11px; background:var(--surface-2); padding:10px; border-radius:8px; max-height:180px; overflow:auto; margin-top:8px;">${esc(state.importRawText.slice(0,6000))}</pre>
      </details>
    `;
  }
  openModal(`
    <div class="modal wide">
      <div class="modal-head"><div><div class="step-dots"><span class="${step>=0?'on':''}"></span><span class="${step>=1?'on':''}"></span></div><h3>Importar fatura em PDF</h3></div><button class="close-x" onclick="closeModal()">✕</button></div>
      <div class="modal-body">${body}</div>
      <div class="modal-foot">
        ${step===1?'<button class="btn btn-outline" onclick="state.importStep=0; renderImportModal();">‹ Voltar</button>':''}
        <div style="flex:1"></div>
        <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
        ${step===1? `<button class="btn btn-primary" onclick="confirmImport()">Importar ${state.importRows.filter(r=>r.include).length} transaç${state.importRows.filter(r=>r.include).length===1?'ão':'ões'}</button>`:''}
      </div>
    </div>
  `);
}
function updateImportRow(i, field, val){ state.importRows[i][field] = val; }
function addImportRow(){
  state.importRows.push({include:true, date:new Date().toISOString().slice(0,10), description:'', category:'c-outros-d', amount:'', installmentCurrent:'', installmentTotal:''});
  renderImportModal();
}

function handlePastedText(){
  state.importCardId = document.getElementById('f_importCard').value;
  if(!state.importCardId){ toast('Selecione o cartão de destino','danger'); return; }
  state.importInvoiceMonth = document.getElementById('f_importMonth').value || state.importInvoiceMonth;
  const text = document.getElementById('pasteTextArea').value;
  if(!text.trim()){ toast('Cole o texto da fatura primeiro','danger'); return; }
  state.importRawText = text;
  state.importRows = parsePdfText(text);
  state.importStep = 1;
  renderImportModal();
}
async function handlePdfFile(ev){
  const file = ev.target.files[0];
  if(!file) return;
  state.importCardId = document.getElementById('f_importCard').value;
  state.importInvoiceMonth = document.getElementById('f_importMonth').value || state.importInvoiceMonth;
  const statusEl = document.getElementById('pdfLoadStatus');
  statusEl.textContent = 'Lendo o PDF...';
  try{
    if(!window._pdfWorkerBlobUrl){
      statusEl.textContent = 'Preparando leitor de PDF...';
      const workerResp = await fetch('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js');
      const workerCode = await workerResp.text();
      window._pdfWorkerBlobUrl = URL.createObjectURL(new Blob([workerCode], {type:'application/javascript'}));
    }
    pdfjsLib.GlobalWorkerOptions.workerSrc = window._pdfWorkerBlobUrl;
    statusEl.textContent = 'Lendo o PDF...';
    const buf = await file.arrayBuffer();
    const doc = await pdfjsLib.getDocument({data:buf}).promise;
    let fullText = '';
    for(let p=1; p<=doc.numPages; p++){
      const page = await doc.getPage(p);
      const content = await page.getTextContent();
      const lines = {};
      content.items.forEach(it=>{
        const y = Math.round(it.transform[5]);
        if(!lines[y]) lines[y] = [];
        lines[y].push({x:it.transform[4], s:it.str});
      });
      const ys = Object.keys(lines).map(Number).sort((a,b)=>b-a);
      ys.forEach(y=>{ const row = lines[y].sort((a,b)=>a.x-b.x).map(o=>o.s).join(' '); fullText += row + '\n'; });
      fullText += '\n';
    }
    state.importRawText = fullText;
    state.importRows = parsePdfText(fullText);
    state.importStep = 1;
    renderImportModal();
  }catch(e){
    console.error(e);
    statusEl.textContent = 'Não foi possível ler este PDF automaticamente. Tente outro arquivo ou lance as despesas manualmente.';
  }
}

function parsePdfText(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const rows = [];
  const dateRe = /^(\d{2})\/(\d{2})(?:\/(\d{2,4}))?/;
  const valueRe = /(-?\d{1,3}(?:\.\d{3})*,\d{2}|-?\d{4,},\d{2})\s*$/;
  const installRe = /(\d{1,2})\s*\/\s*(\d{1,2})(?!\d)/g;
  const refYear = state.month ? state.month.getFullYear() : new Date().getFullYear();

  lines.forEach(line=>{
    const dm = line.match(dateRe);
    const vm = line.match(valueRe);
    if(!dm || !vm) return;
    let desc = line.slice(dm[0].length, line.length - vm[0].length).trim();
    desc = desc.replace(/\s{2,}/g,' ').replace(/^[-–:\s]+|[-–:\s]+$/g,'');
    if(!desc || desc.length<2) return;
    // ignore obvious summary lines
    if(/^total\b|\btotal\s+(de|das|dos)\b|\bsubtotal\b|saldo\s*anterior|limite\s*dispon|pagamento\s*m[ií]nimo/i.test(desc)) return;

    const year = dm[3] ? (dm[3].length===2 ? 2000+parseInt(dm[3]) : parseInt(dm[3])) : refYear;
    const dayNum = parseInt(dm[1]), monthNum = parseInt(dm[2]);
    if(monthNum<1 || monthNum>12 || dayNum<1 || dayNum>31) return; // data invalida, ignora a linha
    const date = year+'-'+dm[2]+'-'+dm[1];

    let amount = vm[1].replace(/\./g,'').replace(',','.');
    amount = parseFloat(amount);
    if(isNaN(amount) || amount===0) return;
    // mantém o sinal: valores negativos representam créditos/estornos que abatem a fatura

    // look for installment pattern inside description (not the leading date)
    let installCur='', installTot='';
    let im; installRe.lastIndex=0;
    while((im = installRe.exec(desc))){
      const a=parseInt(im[1]), b=parseInt(im[2]);
      if(a>=1 && b>=1 && a<=b && b<=48){ installCur=a; installTot=b; desc = (desc.slice(0,im.index)+desc.slice(im.index+im[0].length)).replace(/\s{2,}/g,' ').replace(/[\/\-\(\)]\s*$/,'').trim(); break; }
    }

    rows.push({include:true, date, description:desc, category: amount<0 ? 'c-estornos-d' : guessCategory(desc), amount, installmentCurrent:installCur, installmentTotal:installTot});
  });
  return rows;
}

function confirmImport(){
  const included = state.importRows.filter(r=>r.include && r.description && r.amount);
  if(included.length===0){ toast('Selecione ao menos uma transação para importar','danger'); return; }
  if(!state.importCardId){ toast('Selecione o cartão de destino','danger'); return; }
  const baseTs = Date.now();
  included.forEach((r,i)=>{
    DB.tx.push({
      id:uid(), type:'despesa', description:r.description, category:r.category||'c-outros-d',
      amount:parseFloat(r.amount), date:r.date, status:state.importStatus||'pendente', paymentMethod:'cartao', cardId:state.importCardId,
      invoiceMonth: state.importInvoiceMonth,
      installmentCurrent:r.installmentCurrent||'', installmentTotal:r.installmentTotal||'', recurring:false, dueDate:'', notes:'Importado de fatura',
      createdAt: new Date(baseTs+i).toISOString(),
    });
  });
  persist('tx').then(()=>{ closeModal(); toast(included.length+' transações importadas'); state.page='transacoes'; render(); });
}

/* ============================ INIT ============================ */
document.addEventListener('keydown', function(e){
  const tag = (document.activeElement && document.activeElement.tagName || '').toLowerCase();
  const typing = tag==='input' || tag==='textarea' || tag==='select';
  if(e.key==='Escape'){
    const confirmRoot = document.getElementById('confirmRoot'); if(confirmRoot){ confirmRoot.remove(); return; }
    const modalRoot = document.getElementById('modalRoot'); if(modalRoot){ closeModal(); return; }
    const alertsPanel = document.getElementById('alertsPanel'); if(alertsPanel){ alertsPanel.remove(); return; }
    return;
  }
  if(typing || document.getElementById('modalRoot')) return;
  if(e.key==='n' || e.key==='N'){ e.preventDefault(); openTxModal(null,'despesa'); }
  else if(e.key==='r' || e.key==='R'){ e.preventDefault(); openTxModal(null,'receita'); }
  else if(e.key==='/'){ e.preventDefault(); const s=document.getElementById('globalSearch'); if(s) s.focus(); }
});
(async function init(){
  try{
    await loadAll();
  }catch(e){
    console.error('Falha ao carregar dados:', e);
  }
  try{
    render();
    if(usingFallbackStorage){
      setTimeout(()=>toast('Armazenamento na nuvem indisponível — seus dados estão sendo salvos apenas neste navegador.'), 400);
    }
    setTimeout(()=>checkAutoBackup(), 1200);
    setTimeout(()=>showStartupAlertsPopup(), 700);
  }catch(e){
    console.error('Falha ao renderizar o app:', e);
    document.getElementById('app').innerHTML = '<div style="padding:50px; font-family:Inter,sans-serif; max-width:520px; margin:0 auto; text-align:center; color:#374151;">'+
      '<div style="font-size:32px; margin-bottom:12px;">⚠️</div>'+
      '<h2 style="font-size:18px; margin-bottom:8px;">Não foi possível carregar o orça•me</h2>'+
      '<p style="font-size:13px; color:#6B7280;">Ocorreu um erro inesperado. Abra o console do navegador para detalhes técnicos, ou tente recarregar a página.</p>'+
      '</div>';
  }
})();
